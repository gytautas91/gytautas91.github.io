<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenerife On routes</title>
<style>
  :root { color-scheme: light; --ink: #1c1915; --muted: #5c564c; --line: #e4ddd2; --paper: #f7f3ec; --card: #fffdf9; --accent: #9a3412; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 Georgia, "Iowan Old Style", Palatino, serif; color: var(--ink); background: var(--paper); }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 16px 22px; background: #fffdf9; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .controls { display: flex; gap: 10px; align-items: center; font-family: "Segoe UI", sans-serif; font-size: 14px; }
  select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); background: white; color: var(--ink); }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 16px; }
  article { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 12px; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
  .meta { margin: 6px 0 8px; color: var(--muted); font-family: "Segoe UI", sans-serif; font-size: 14px; }
  .rating { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; white-space: nowrap; }
  p { margin: 0 0 10px; overflow-wrap: anywhere; }
  .note { color: var(--accent); font-family: "Segoe UI", sans-serif; font-size: 14px; }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
  .photos button { border: 0; padding: 0; background: none; cursor: zoom-in; min-width: 0; }
  .photos img { display: block; width: 100%; height: 260px; object-fit: cover; border-radius: 8px; background: #eee; }
  a.page { font-family: "Segoe UI", sans-serif; font-size: 14px; color: var(--accent); }
  .map-wrap { max-width: 720px; margin: 16px auto 0; padding: 0 16px; }
  .map-wrap p { margin: 0 0 6px; font-family: "Segoe UI", sans-serif; font-size: 13px; color: var(--muted); }
  #island { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); background: #d7e6ea; }
  .spot { cursor: pointer; }
  .spot circle { fill: #fffdf9; stroke: #6d5c49; stroke-width: 1.5; }
  .spot text { font-family: "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink); text-anchor: middle; pointer-events: none; }
  .spot.on circle { fill: var(--accent); stroke: var(--accent); }
  .spot.on text { font-weight: 650; }
  #lightbox { position: fixed; inset: 0; background: rgba(20, 16, 12, 0.88); display: none; align-items: center; justify-content: center; z-index: 5; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: min(1100px, 94vw); max-height: 90vh; object-fit: contain; }
  #lightbox button { position: absolute; top: 12px; right: 16px; font-size: 28px; color: white; background: none; border: 0; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Tenerife On routes</h1>
  <div class="controls">
    <label for="area">Area</label>
    <select id="area">
      <option value="">All areas</option>
    </select>
    <label for="sort">Sort</label>
    <select id="sort">
      <option value="rating-desc">Rating, high to low</option>
      <option value="rating-asc">Rating, low to high</option>
    </select>
    <span id="count"></span>
  </div>
</header>

    <g class="spot" data-area="North" tabindex="0" role="button"><circle cx="250" cy="108" r="15"/><text x="250" y="88">North</text></g>

    <g class="spot" data-area="Güímar" tabindex="0" role="button"><circle cx="455" cy="175" r="15"/><text x="498" y="179">Güímar</text></g>
    <g class="spot" data-area="Adeje" tabindex="0" role="button"><circle cx="210" cy="236" r="15"/><text x="210" y="268">Adeje</text></g>

<script id="routes" type="application/json">[{"name":"“Viñátigos Centenarios” Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-interpretado-vinatigos-centenarios-guardianes-centenarios-2","distance_km":null,"rating":4,"difficulty":"Low","description":"The name of this trail alludes to the immense ancient viñatigo trees (Persea indica) that stand guard over this delightful walk. It is a circular trail of 1 km that starts at the Agua García Heritage Information Centre and follows the course of the Toledo and Salto Blanco ravines, crossing two wooden bridges on the way. After a walk through a forest brimming with local flora and fauna, the trail ends at the same point where it started.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_interpretado_Vinatigos_Centenarios/Fotos_Cuevas_de_Toledo.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_interpretado_Vinatigos_Centenarios/Sendero_Guardianes_Centenarios.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_interpretado_Vinatigos_Centenarios/Sendero_Guardianes_Centenarios_2.jpg"],"region":"Agua García","permit":"","notice":""},{"name":"Agua García Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-gte-01-sendero-accesible-agua-garcia","distance_km":null,"rating":0,"difficulty":"Low","description":"The Agua García Accessible Trail runs through the Protected Landscape of Las Lagunetas and contains one of the best examples of laurel forest on the island of Tenerife. It is a fully accessible route for people with reduced mobility with 5 rest areas. After just a few metres, you will find yourself deep in lush woodland traversing the ravines of Barranco de Toledo and Barranco del Salto Blanco.","photos":["https://www.tenerifeon.es/images/Senderos/SA_GTE_01_Sendero_Accesible_Agua_Garci%CC%81a/%C3%A1rea_de_descanso.jpg","https://www.tenerifeon.es/images/Senderos/SA_GTE_01_Sendero_Accesible_Agua_Garci%CC%81a/opt-Sendero_Accesible_Agua_Garci%CC%81a_02.jpg","https://www.tenerifeon.es/images/Senderos/SA_GTE_01_Sendero_Accesible_Agua_Garci%CC%81a/Fotos_Cuevas_de_Toledo.jpg","https://www.tenerifeon.es/images/Senderos/SA_GTE_01_Sendero_Accesible_Agua_Garci%CC%81a/Sendero_Accesible_5.jpg"],"region":"Agua García","permit":"","notice":""},{"name":"Alto de Guamaso Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-pnt-06-sendero-accesible-alto-de-guamaso","distance_km":null,"rating":4.5,"difficulty":"Low","description":"This flat and accessible trail takes you right up to the volcanic cone of Guamaso. The cone was formed by the accumulation of volcanic material with striking lava bombs dotted over its slopes. This route immerses you in the typical vegetation of the National Park, and you can see the transition from Canary Island pine forest to high mountain scrubland.","photos":["https://www.tenerifeon.es/images/Senderos/SA_PNT_06_Sendero_Accesible_Altos_de_Guamaso/opt-Sendero_Alto_de_Guamaso_3.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_06_Sendero_Accesible_Altos_de_Guamaso/opt-Sendero_Alto_de_Guamaso_2.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_06_Sendero_Accesible_Altos_de_Guamaso/opt-P1000777.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_06_Sendero_Accesible_Altos_de_Guamaso/opt-P1000772.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_06_Sendero_Accesible_Altos_de_Guamaso/opt-P1000771.jpg"],"region":"Teide National Park","permit":"","notice":""},{"name":"Barranco del Infierno Trail","url":"https://www.tenerifeon.es/en/routes/hiking/barranco-del-infierno-trail","distance_km":3,"rating":3.5,"difficulty":"Medium","description":"The Barranco del Infierno trail runs through the Special Nature Reserve of the same name, from the village of Adeje to a 200-metre high waterfall. The route takes you through groves of cardón or Canary Island spurge (Euphorbia canariensis) and tabaiba (Euphorbia balsamifera, Euphorbia lamarckii) in the lower areas, and then through the pine forests that dominate the higher sections. It is a good trail for bird lovers.","photos":["https://www.tenerifeon.es/images/Senderos/Barranco_del_Infierno/IMG_9332-Edit.jpg","https://www.tenerifeon.es/images/Senderos/Barranco_del_Infierno/IMG_0025-Edit.jpg","https://www.tenerifeon.es/images/Senderos/Barranco_del_Infierno/IMG_9311-Edit.jpg","https://www.tenerifeon.es/images/Senderos/Barranco_del_Infierno/IMG_9981-Edit.jpg"],"region":"Adeje","permit":"","notice":""},{"name":"BC 1.5 La Lagunetilla Honda","url":"https://www.tenerifeon.es/en/routes/cycling-horse-riding/bc-1-5-la-lagunetilla-honda","distance_km":4.21,"rating":0,"difficulty":"","description":"This route offers you the chance to immerse yourself in Tenerife’s main ecosystems whilst enjoying amazing views of the north of the island.","photos":["https://www.tenerifeon.es/images/Bicicleta__Caballo/BC_01.5/opt-bc1_5-377.jpg","https://www.tenerifeon.es/images/Bicicleta__Caballo/BC_01.5/opt-bc1_5-378.jpg","https://www.tenerifeon.es/images/Bicicleta__Caballo/BC_01.5/opt-bc1_5-383.jpg","https://www.tenerifeon.es/images/Bicicleta__Caballo/BC_01.5/opt-bc1_5-384.jpg","https://www.tenerifeon.es/images/Bicicleta__Caballo/BC_01.5/opt-bc1_5-385.jpg","https://www.tenerifeon.es/images/Bicicleta__Caballo/BC_01.5/opt-bc1_5-164236.jpg"],"region":"BC-1.5 Las Lagunetas Protected Landscape, extension of route BC 1 to the La Lagunetilla Chica Recreational Area.","permit":"","notice":""},{"name":"Bolico Loop Trail (Long)","url":"https://www.tenerifeon.es/en/routes/hiking/ruta-circular-de-bolico-larga-2","distance_km":null,"rating":3.5,"difficulty":"High","description":"The Bolico long trail is a walk of about three hours that gives walkers a complete experience of the natural splendour of Teno Rural Park. This route immerses you in the monteverde woodland and treats you to spectacular views of the Teno Massif, allowing you to fully explore one of Tenerife’s most iconic landscapes. It starts at the charming public library in Las Portelas. From here, take Camino de la Barrera towards Albergue de Bolico (Bolico hostel).","photos":["https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Larga/Nuevas_horizontal_Bolico_largo_1.jpg","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Larga/Nuevas_horizontal_Bolico_largo_2.jpg","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Larga/Nuevas_horizontal_Bolico_largo_3.jpg","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Larga/Nuevas_horizontal_Bolico_largo_4.jpg","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Larga/Nuevas_horizontal_Bolico_largo_5.jpg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"Bolico Loop Trail (Medium)","url":"https://www.tenerifeon.es/en/routes/hiking/ruta-bolico-media-2","distance_km":3.67,"rating":2.5,"difficulty":"Medium","description":"The Bolico medium trail immerses you in the natural splendour of Teno Rural Park on a walk of approximately one and a half hours. It is easily accessible and provides you with the opportunity to plunge deep into one of the most representative ecosystems of the area: monteverde woodland. The route starts at the car park near the Bolico hostel, a perfect starting point to discover the rich biodiversity of the park.","photos":["https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Media/Horizontal_1.jpg","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Media/Horizontal_2_Bolico.JPG","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Media/Vertical_1.JPG","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Media/Vertical_2_Bolico.JPG","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Media/VErtical_3_Bolico.JPG"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"Bolico Loop Trail (Short)","url":"https://www.tenerifeon.es/en/routes/hiking/ruta-bolico-corta-2","distance_km":2.43,"rating":3,"difficulty":"Low","description":"The Bolico short trail allows you to discover the beauty of Teno Rural Park in just an hour’s walk. It is a short trail, easy to access and ideal for families, which offers a rich variety of landscapes and introduces you to the characteristic monteverde woodland of the Teno Massif. The route starts next to the Bolico hostel, in an unparalleled natural setting. From here, the path leads you up a steep initial climb and then turns off to the right along the PR-TF 56 trail.","photos":["https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Corta/Portada_Bolico_corta.jpg","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Corta/Bolico_corta_vertical_2.JPG","https://www.tenerifeon.es/images/Senderos/Ruta_Bolico_Corta/Bolico_corta_vertical_3.JPG"],"region":"Parque Rural de Teno","permit":"","notice":""},{"name":"Bosque de Los Enigmas Self-guided Interpretative Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/the-forest-of-enigmas","distance_km":4.78,"rating":3,"difficulty":"Low","description":"This loop trail for the whole family starts and ends at the Zapata viewpoint and is a great way to discover the laurisilva, or laurel forest. The trail is located within the Anaga Rural Park, in the municipalities of San Cristóbal de La Laguna and Tegueste. It shares part of its route with two short-distance trails, PR-TF 11 (El Batán - Punta del Hidalgo) and PR-TF 12 (Bajamar), as well as with the self-guided “Hija Cambada” trail.","photos":["https://www.tenerifeon.es/images/Senderos/Bosque_de_los_Enigmas/WhatsApp_Image_2022-10-18_at_11.34.57_1.jpeg","https://www.tenerifeon.es/images/Senderos/Bosque_de_los_Enigmas/WhatsApp_Image_2022-10-18_at_11.31.37_1.jpeg","https://www.tenerifeon.es/images/Senderos/Bosque_de_los_Enigmas/WhatsApp_Image_2022-10-18_at_11.31.38.jpeg","https://www.tenerifeon.es/images/Senderos/Bosque_de_los_Enigmas/WhatsApp_Image_2022-10-18_at_11.31.38_1.jpeg","https://www.tenerifeon.es/images/Senderos/Bosque_de_los_Enigmas/WhatsApp_Image_2022-10-18_at_11.31.44.jpeg","https://www.tenerifeon.es/images/Senderos/Bosque_de_los_Enigmas/WhatsApp_Image_2022-10-18_at_11.34.45.jpeg"],"region":"Macizo de Anaga","permit":"","notice":""},{"name":"Botanical Garden Circular Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-pnt-02-sendero-accesible-jardin-botanico-circular","distance_km":null,"rating":4.5,"difficulty":"Very low","description":"Accessible and signposted trail through the Botanical Garden of the Teide National Park, starting from the El Portillo Visitor Centre. The garden occupies 4 hectares and was created to exhibit, interpret, research and reproduce local flora. It is well signposted and contains more than 75% of the vascular plant species of the National Park.","photos":["https://www.tenerifeon.es/images/Senderos/SA_PNT_02_Sendero_Accesible_Jardi%CC%81n_Bota%CC%81nico_Circular/opt-IMG_20180413_151817417.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_02_Sendero_Accesible_Jardi%CC%81n_Bota%CC%81nico_Circular/opt-IMG_20180413_151857152_HDR.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_02_Sendero_Accesible_Jardi%CC%81n_Bota%CC%81nico_Circular/opt-IMG_20180413_152303700.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_02_Sendero_Accesible_Jardi%CC%81n_Bota%CC%81nico_Circular/opt-IMG_20180413_152508812.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_02_Sendero_Accesible_Jardi%CC%81n_Bota%CC%81nico_Circular/opt-IMG_20180413_152557811.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_02_Sendero_Accesible_Jardi%CC%81n_Bota%CC%81nico_Circular/opt-IMG_20180413_152654015.jpg"],"region":"Parque Nacional del Teide","permit":"","notice":""},{"name":"Botanical Garden Linear Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-pnt-01-sendero-accesible-jardin-botanico-lineal","distance_km":null,"rating":3,"difficulty":"Low","description":"This accessible trail runs through the Botanical Garden of the Teide National Park, where more than 75% of the park’s vascular plant species are represented. Almost 200 m long, it is fully adapted for people with reduced mobility, with an average width of 1.5 m and turning space of 5 m in diameter. The aim of this garden is to exhibit, interpret, research and reproduce local native flora.","photos":["https://www.tenerifeon.es/images/Senderos/SA_PNT_01_Sendero_accesible_Jardi%CC%81n_Bota%CC%81nico_Lineal/opt-_NDR7642.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_01_Sendero_accesible_Jardi%CC%81n_Bota%CC%81nico_Lineal/opt-_NDR7603.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_01_Sendero_accesible_Jardi%CC%81n_Bota%CC%81nico_Lineal/opt-IMG_20180413_140106918.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_01_Sendero_accesible_Jardi%CC%81n_Bota%CC%81nico_Lineal/opt-IMG_20180413_140005756.jpg"],"region":"Teide National Park","permit":"","notice":""},{"name":"Camino a Candelaria (La Crucita - Arafo)","url":"https://www.tenerifeon.es/en/routes/hiking/camino-a-candelaria-crucita-arafo-3","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"From the viewpoint, the Sendero de Los Peregrinos begins, a historic path that connects La Crucita with the municipalities of Güímar, Arafo, and Candelaria. The trail descends through the Caldera de Pedro Gil, crossing the lava flow from the La Arena volcano. This route is particularly significant for many residents of the island's north, who walk it every year on their pilgrimage to the Basilica of Candelaria.","photos":["https://www.tenerifeon.es/images/Senderos/CC_02.2/Mirador_de_la_Crucita.jpg","https://www.tenerifeon.es/images/Senderos/CC_02.2/Sendero_Crucita_Candelaria_modificado_2.jpg"],"region":"Altos de Arafo","permit":"","notice":""},{"name":"Caramujo Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-pnt-05-sendero-accesible-caramujo","distance_km":null,"rating":0,"difficulty":"Low","description":"This accessible trail runs along a flat path from Roque del Caramujo viewpoint to the base of the Roque. It is 200 m long and has been adapted to make it accessible to all, with an average width of 1.5 m and a final turning space of 7 m in diameter. As a result, you can relax and enjoy the scenery at your own pace. Nearby you can also see the surviving remains of old herders’ huts.","photos":["https://www.tenerifeon.es/images/Senderos/SA_PNT_05_Sendero_Accesible_Caramujo/opt-Panorama_sin_ti%CC%81tulo1.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_05_Sendero_Accesible_Caramujo/opt-Roque_de_Caramujo.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_05_Sendero_Accesible_Caramujo/opt-_NDR6784.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_05_Sendero_Accesible_Caramujo/opt-_NDR6829.jpg","https://www.tenerifeon.es/images/Senderos/SA_PNT_05_Sendero_Accesible_Caramujo/opt-_NDR6847.jpg"],"region":"Teide National Park","permit":"","notice":""},{"name":"Casas de Los Pedregales Self-guided Loop Trail (Route 1)","url":"https://www.tenerifeon.es/en/routes/hiking/scircular-casas-de-los-pedregales-4","distance_km":null,"rating":3.5,"difficulty":"Very low","description":"A short, easy walk to explore the old rural estate of Finca de los Pedregales, where the offices of the Teno Rural Park are located today. Thanks to a free audio guide, you can explore the history of this place and learn how its inhabitants organised and cooperated in order to survive when times were hard.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Los_Pedregales_-_Oficina_PR_Teno_-_%C3%81rea_Recreativa/Sendero_Los_Pedregales-Of._PR_Teno-1.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Los_Pedregales_-_Oficina_PR_Teno_-_%C3%81rea_Recreativa/Sendero_Los_Pedregales-Of._PR_Teno-3.jpg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"El Palmar – Baracán Loop Trail via Teno Alto","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-circular-el-palmar-baracan-por-teno-alto-2","distance_km":null,"rating":3,"difficulty":"High","description":"This demanding hike gives visitors a complete experience of Teno Rural Park, crossing a wide variety of landscapes along the way: old, cobbled paths, panoramic views of Palmar Valley, where agriculture takes pride of place, the hamlet of Teno Alto, with its livestock farming tradition, and the spectacular scenery of Baracán.","photos":["https://www.tenerifeon.es/images/Senderos/El_Palmar_Baracan/Baracan_3.jpg","https://www.tenerifeon.es/images/Senderos/El_Palmar_Baracan/Baracan_1.jpg","https://www.tenerifeon.es/images/Senderos/El_Palmar_Baracan/Baracan_2.jpg","https://www.tenerifeon.es/images/Senderos/El_Palmar_Baracan/Baracan_4.jpg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"El Palmar – Monte del Agua Loop Trail via Las Lagunetas","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-circular-el-palmar-monte-del-agua-por-las-lagunetas-2","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"This extended two and a half hour walk immerses you fully in the biodiversity of Monte del Agua and landscapes that bear the imprint of the agricultural past of this area of north-west Tenerife. The walk starts near Los Pedregales Visitor Centre, an ideal place to prepare for the hike and learn about the area. To begin, cross the main road with care and head south along Calle Las Cuevas.","photos":["https://www.tenerifeon.es/images/Senderos/El_Palmar_Monte_del_Agua_por_Las_Lagunetas/Monte_del_Agua_3.jpg","https://www.tenerifeon.es/images/Senderos/El_Palmar_Monte_del_Agua_por_Las_Lagunetas/Monte_del_Agua_1.jpg","https://www.tenerifeon.es/images/Senderos/El_Palmar_Monte_del_Agua_por_Las_Lagunetas/Monte_del_Agua_2.jpg","https://www.tenerifeon.es/images/Senderos/El_Palmar_Monte_del_Agua_por_Las_Lagunetas/Monte_del_Agua_4.jpg","https://www.tenerifeon.es/images/Senderos/El_Palmar_Monte_del_Agua_por_Las_Lagunetas/Monte_del_Agua_5.jpg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"Erjos – Monte del Agua Loop Trail via Fuente Los Loros","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-circular-erjos-monte-del-agua-por-fuente-los-loros-2","distance_km":null,"rating":3.5,"difficulty":"High","description":"This route of approximately two and a half hours takes walkers on a delightful journey through Monte del Agua, in Teno Rural Park. The route combines, among many other things, panoramic views of Mount Teide, a plunge into the rich laurel forest vegetation and the unique charm of the ponds known as Charcas of Erjos, all of which adds up to a complete and memorable experience of Tenerife’s nature and history.","photos":["https://www.tenerifeon.es/images/Senderos/Circular_Erjos_Monte_del_Agua_Fuente_Los_Loros/Los_Loros_1.jpeg","https://www.tenerifeon.es/images/Senderos/Circular_Erjos_Monte_del_Agua_Fuente_Los_Loros/Los_Loros_2.jpeg","https://www.tenerifeon.es/images/Senderos/Circular_Erjos_Monte_del_Agua_Fuente_Los_Loros/Los_Loros_3.jpeg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"Erjos – Monte del Agua Self-guided Trail","url":"https://www.tenerifeon.es/en/routes/hiking/erjos-monte-del-agua-self-guided-trail","distance_km":null,"rating":3.5,"difficulty":"Low","description":"Take a walk around Erjos to learn about its history and the values that define it today. The walk follows an out-and-back, low-difficulty route. It starts in Plaza Nueva and winds its way between houses and farmland. It then climbs upwards to reach Monte del Agua, where both the landscape and the climate will change radically, as will your sensations. This last section runs along an accessible path.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_52_Erjos_Las_Portelas/opt-_ndr5900.jpg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"Finca Los Pedregales Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-prt-02-sendero-accesible-finca-los-pedregales","distance_km":null,"rating":3.5,"difficulty":"Very low","description":"An audio-guided route that allows you to explore the past and present of Finca Los Pedregales, accompanied by its last sharecropper. Please note that the accessible section covers stops 1 to 4.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Accesible_Finca_Los_Pedregales/IMG_5976.JPG"],"region":"Teno Rural Park","permit":"","notice":""},{"name":"GR 131.1 Anaga - Chasna section from Degollada de Guajara to Parador de las Cañadas","url":"https://www.tenerifeon.es/en/routes/hiking/gr-131-1-anaga-chasna-section-from-degollada-de-guajara-to-parador-de-las-canadas","distance_km":3.58,"rating":0,"difficulty":"Low","description":"Extension of the GR 131 that will lead you through unique and breathtaking volcanic landscapes to the Parador de las Cañadas del Teide. This route branches off from the long-distance trail from Anaga to Chasna between stages 3 and 4 and will immerse you in a magical landscape of contrasting colours and textures as you make your way to the delightful Parador de las Cañadas del Teide.","photos":["https://www.tenerifeon.es/images/Senderos/131.1_GR/opt-Panorama_sin_ti%CC%81tulo21.jpg","https://www.tenerifeon.es/images/Senderos/131.1_GR/opt-Panorama_sin_ti%CC%81tulo24.jpg","https://www.tenerifeon.es/images/Senderos/131.1_GR/opt-Panorama_sin_ti%CC%81tulo25.jpg","https://www.tenerifeon.es/images/Senderos/131.1_GR/opt-_NDR7237.jpg","https://www.tenerifeon.es/images/Senderos/131.1_GR/opt-_NDR7336.jpg","https://www.tenerifeon.es/images/Senderos/131.1_GR/opt-_NDR7304.jpg"],"region":"GR-131.1 Teide National Park, extension of GR 131 from Degollada de Guajara to Parador de las Cañadas.","permit":"","notice":""},{"name":"Hija Cambada","url":"https://www.tenerifeon.es/en/routes/hiking/pra-14-hija-cambada","distance_km":null,"rating":0,"difficulty":"Low","description":"This simple self-guided trail through the Anaga Rural Park takes you deep into the laurisilva, or laurel forest, which stretched across the Mediterranean 20 million years ago. The route begins on the track next to the restaurant in front of the Cruz del Carmen car park. After about 100 metres, you will come to a turning on your left marked with the sign “Hija Cambada”.","photos":["https://www.tenerifeon.es/images/Senderos/Hija_Cambada/WhatsApp_Image_2022-10-18_at_11.31.44_1.jpeg","https://www.tenerifeon.es/images/Senderos/Hija_Cambada/WhatsApp_Image_2022-10-18_at_11.31.40.jpeg","https://www.tenerifeon.es/images/Senderos/Hija_Cambada/WhatsApp_Image_2022-10-18_at_11.34.46.jpeg","https://www.tenerifeon.es/images/Senderos/Hija_Cambada/WhatsApp_Image_2022-10-18_at_11.34.47.jpeg"],"region":"Macizo de Anaga","permit":"","notice":""},{"name":"La Asomada - Cruz de Afur (Monte Aguirre Exclusion Zone)","url":"https://www.tenerifeon.es/en/routes/hiking/pra-18-la-asomada-cruz-de-afur","distance_km":2.37,"rating":3,"difficulty":"Medium","description":"To follow this trail, prior authorisation must be requested on this same page. Monte Aguirre is also known as Manantial de Anaga (“Anaga Spring”), as it was the point from which water and wood were supplied to Santa Cruz. The trail is easy as it is mostly flat, except for the last stretch, which takes you over gentle stone steps. It plunges you deep into the wonderful laurel forest, bathed by the trade winds, as far as Cruz de Afur.","photos":["https://www.tenerifeon.es/images/Senderos/La_Asomada_Cruz_de_Afur/b4338793-b88c-4df6-9297-1a21ba8282f0.jpg","https://www.tenerifeon.es/images/Senderos/La_Asomada_Cruz_de_Afur/6c942474-f4f8-4e6b-988e-d51e3a98453f.jpg","https://www.tenerifeon.es/images/Senderos/La_Asomada_Cruz_de_Afur/108d2e84-e40c-4a4d-965d-65dbadaa66d6.jpg","https://www.tenerifeon.es/images/Senderos/La_Asomada_Cruz_de_Afur/f60f38b8-792c-4b48-ab47-19bed766233b.jpg","https://www.tenerifeon.es/images/Senderos/La_Asomada_Cruz_de_Afur/fa9b143d-aeb5-4c59-919f-da8a543060ed.jpg"],"region":"Macizo de Anaga","permit":"","notice":""},{"name":"La Ensillada - Cabezo de Tejo - La Ensillada Loop Trail (Reserva Natural Integral El Pijaral)","url":"https://www.tenerifeon.es/en/routes/hiking/pra-72-la-ensillada-cabezo-del-tejo","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"To follow this trail, prior authorisation must be requested on this same page. This medium-difficulty trail, measuring just over 6 kilometres, starts at the La Ensillada car park and takes in the CabezodelTejo viewpoint, which offers views of part of the village of Taganana and the north coast of the Anaga Massif. To access this trail, a prior reservation is mandatory.","photos":["https://www.tenerifeon.es/images/Senderos/La_Ensillada_Cabeza_de_Tejo/Nuevas_Ensillada_Cabeza_de_Tejo/e734108e-ede0-4304-9682-f7afd198ba42.jpg","https://www.tenerifeon.es/images/Senderos/La_Ensillada_Cabeza_de_Tejo/Nuevas_Ensillada_Cabeza_de_Tejo/89cd315e-aae7-4199-80bc-9d3783e778be.jpg","https://www.tenerifeon.es/images/Senderos/La_Ensillada_Cabeza_de_Tejo/Nuevas_Ensillada_Cabeza_de_Tejo/2431ca21-5633-44df-9d7f-74845fc77152.jpg"],"region":"Macizo de Anaga","permit":"","notice":""},{"name":"Los Pedregales Recreational Area Self-Guided Trail (Route 2)","url":"https://www.tenerifeon.es/en/routes/hiking/sia-prt-02n-itinerario-autoguiado-finca-los-pedregales-5","distance_km":null,"rating":4,"difficulty":"Low","description":"Route with audioguide. The last tenant farmer of Finca Los Pedregales takes you through its past and present. Prepare to journey back in time as you walk among ancient agricultural terraces stretching towards the summit—remnants of a traditional way of life based on farming and livestock rearing, now reclaimed by vegetation.","photos":["https://www.tenerifeon.es/images/Senderos/Autoguiado_Finca_los_Pedregales/264ef900-60a8-43e7-950c-2046b2c3e994.jpg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"Masca Gorge Trail","url":"https://www.tenerifeon.es/en/routes/hiking/masca-gorge-trail","distance_km":4.81,"rating":3,"difficulty":"High","description":"The Masca Gorge Trail runs through one of the best-known areas of Teno Rural Park, from the hamlet of Masca down to the cove of the same name. Along the route, you will descend through a deep, rugged gorge, between high volcanic walls, narrow ravines and vegetation adapted to this steep landscape.","photos":["https://www.tenerifeon.es/images/Senderos/Camino_Barranco_de_Masca/Barranco_de_Masca_4.jpeg","https://www.tenerifeon.es/images/Senderos/Camino_Barranco_de_Masca/Barranco_de_Masca_2.jpeg","https://www.tenerifeon.es/images/Senderos/Camino_Barranco_de_Masca/Barranco_de_Masca_3.jpeg"],"region":"Parque Rural de Teno","permit":"","notice":"Access is regulated. Shuttle from Santiago del Teide. Check TITSA."},{"name":"Monte del Agua Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-prt-01-accesible-monte-del-agua","distance_km":null,"rating":0,"difficulty":"Very low","description":"This section of the Monte del Agua trail is designed to offer a self-guided and accessible route through its beautiful forest. You will discover one of the richest and most complex ecosystems in the Canary Islands, the monteverde, made up of around twenty broadly similar species of trees, numerous small plants, lichens and mosses, and rich fauna that includes endemic birds and insects.","photos":["https://www.tenerifeon.es/images/Senderos/SA_PRT_01_Accesible_Monte_del_Agua/opt-_NDR5900.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRT_01_Accesible_Monte_del_Agua/opt-04_SAMAVista.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRT_01_Accesible_Monte_del_Agua/opt-04_SAMATramo3.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRT_01_Accesible_Monte_del_Agua/opt-04_SAMATramo2.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRT_01_Accesible_Monte_del_Agua/opt-04_SAMATramo.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRT_01_Accesible_Monte_del_Agua/opt-04_SAMAMirador.jpg"],"region":"Teno Rural Park","permit":"","notice":""},{"name":"Path of Senses 1.- Be amazed","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-de-los-sentidos-2-dejate-sorprender-2","distance_km":null,"rating":4,"difficulty":"Very low","description":"Two routes known as The Trail of the Senses start from Cruz del Carmen along an old camino real (“royal road” or main island route) that once linked the villages of Anaga and La Laguna. All three options offer different experiences that use smell, sight and touch to discover the natural environment and its features. Along the route, various panels with sensory signs (nose, hand and eye) invite you to smell, touch or look at one of the features of the trail.","photos":["https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-_NDR1317.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-Sendero_de_Los_Sentidos.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-Sendero_de_Los_Sentidos_6.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-Sendero_de_Los_Sentidos_10.jpg"],"region":"Anaga Rural Park","permit":"","notice":""},{"name":"Path of Senses 2.- What the ever-green forest has to hide","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-de-los-sentidos-3-lo-que-encierra-el-monteverde-2","distance_km":null,"rating":3.5,"difficulty":"Low","description":"Two routes known as The Trail of the Senses start from Cruz del Carmen along an old camino real (“royal road” or main island route) that once linked the villages of Anaga and La Laguna. All three options offer different experiences that use smell, sight and touch to discover the natural environment and its features. Along the route, various panels with sensory signs (nose, hand and eye) invite you to smell, touch or look at one of the features of the trail.","photos":["https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-_NDR1285.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-Sendero_de_Los_Sentidos.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-Sendero_de_Los_Sentidos_6.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-Sendero_de_Los_Sentidos_10.jpg","https://www.tenerifeon.es/images/Senderos/SA_PRA_01_Sendero_de_Los_Sentidos/opt-_NDR1317.jpg"],"region":"Anaga Rural Park","permit":"","notice":""},{"name":"Pista de Las Hiedras","url":"https://www.tenerifeon.es/en/routes/hiking/pista-de-las-hiedras-2","distance_km":4.44,"rating":3.5,"difficulty":"Low","description":"This route runs along a flat forest track that has very little elevation change and is surrounded by laurel forest and fayal-brezal (Morella-Erica heath). You will also notice that the hillside is covered with abundant rock vegetation, consisting mainly of mosses, lichens and Aeoniums (“bejeques”), succulent plants with a curious rosette shape. A few minutes’ walk along the path you will find a spring, which has now become a stone fountain.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Pista_de_las_Hiedras/pista-las-hiedras-pr-anaga-gal01.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Pista_de_las_Hiedras/pista-las-hiedras-pr-anaga-gal03.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Pista_de_las_Hiedras/pista-las-hiedras-pr-anaga-gal04.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Pista_de_las_Hiedras/pista-las-hiedras-pr-anaga-gal05.jpg"],"region":"Macizo de Anaga","permit":"","notice":""},{"name":"Pista de las Hiedras Adapted and Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-adaptado-pista-de-las-hiedras-2","distance_km":3.7,"rating":0,"difficulty":"Very low","description":"Adapted and accessible section that takes in the first 800 m of the beautiful Pista de las Hiedras, in the heart of Anaga Rural Park. The accessible route starts at the top of the Río ravine and has adapted car parks at the trailhead, as well as seating along the route and a rest area next to an old aggregate quarry, which has now been reclaimed by native fauna and flora.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Pista_de_las_Hiedras/pista-las-hiedras-pr-anaga-gal04.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Pista_de_las_Hiedras/pista-las-hiedras-pr-anaga-gal01.jpg"],"region":"Macizo de Anaga","permit":"","notice":""},{"name":"PNT 01 La Fortaleza","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-01-la-fortaleza","distance_km":null,"rating":5,"difficulty":"Low","description":"With little elevation gain at high altitude, this route is perfect for observing the most characteristic flora and fauna of the Teide National Park. It starts at the Portillo Visitor Centre, inside the park, and heads north-west, reaching Cañada de Los Guancheros and ending at the rock face of La Fortaleza. The well-signposted route takes you past mounds of pumice stone from the eruptions of Montaña Blanca.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/opt-_NDR1755.jpg","https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/opt-04_Teide1LaFortaleza.jpg","https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/opt-deporte_senderismo_1._La_Fortaleza__parque_nacional_teide_volcanes_Panorama_1.jpg","https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/opt-_NDR1672.jpg","https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/opt-_NDR1679.jpg","https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/opt-_NDR1697.jpg"],"region":"PNT-01 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 02 Arenas Negras Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-02-arenas-negras","distance_km":null,"rating":3.5,"difficulty":"Low","description":"This loop trail climbs upwards bordering Montaña del Cerrillar amidst abundant bushes of Teide white broom or retama (Spartocytisus supranubius) that have taken root in the pumice. At the top, the trail affords a spectacular panoramic view of the Teide National Park and the Llano de Maja plain. It is also a good vantage point to observe how the trade winds form a sea of clouds over the Orotava Valley.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_02_Arenas_Negras/opt-04_Teide2ArenasNegras.jpg","https://www.tenerifeon.es/images/Senderos/PNT_02_Arenas_Negras/opt-04_Teide2ArenasNegras3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_02_Arenas_Negras/opt-07_Teide2Guamaso.jpg","https://www.tenerifeon.es/images/Senderos/PNT_02_Arenas_Negras/opt-07_Teide2LlanoMaja.jpg","https://www.tenerifeon.es/images/Senderos/PNT_02_Arenas_Negras/opt-deporte_senderismo_2._Arenas_Negras__parque_nacional_teide_volcanes__NDR1882.jpg","https://www.tenerifeon.es/images/Senderos/PNT_02_Arenas_Negras/opt-_NDR1995.jpg"],"region":"PNT-02 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 03 Roques de García Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-03-roques-de-garcia","distance_km":3.47,"rating":3.5,"difficulty":"Low","description":"One of the most popular trails in the National Park due to its low difficulty and the great beauty of its landscapes, with Mount Teide stealing the show. The route takes you around the Roques de García, the most striking of which are Cinchado and Torrotito. The start of the route takes you along the accessible Roques de García trail. Then follow a flat path, leaving the famous rock formations to your left, to the plain known as Llano de Ucanca.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_03_Roques_de_Garci%CC%81a/opt-07_Teide3Cinchado.jpg","https://www.tenerifeon.es/images/Senderos/PNT_03_Roques_de_Garci%CC%81a/opt-04_Teide3RoquesGarcia.jpg","https://www.tenerifeon.es/images/Senderos/PNT_03_Roques_de_Garci%CC%81a/opt-07_Teide3Escaleras.jpg","https://www.tenerifeon.es/images/Senderos/PNT_03_Roques_de_Garci%CC%81a/opt-_NDR2081.jpg","https://www.tenerifeon.es/images/Senderos/PNT_03_Roques_de_Garci%CC%81a/opt-_NDR2179.jpg"],"region":"PNT-03 Teide National Park","permit":"","notice":""},{"name":"PNT 04.1 Portillo Alto Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-04-1-portillo-alto-spur-trail","distance_km":null,"rating":2,"difficulty":"Low","description":"Short branch of just over half a kilometre that extends the PNT 04 (Siete Cañadas) trail to Portillo Alto.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_04.1_Ramal_Portillo_Alto/opt-P1000993.jpg","https://www.tenerifeon.es/images/Senderos/PNT_04.1_Ramal_Portillo_Alto/opt-IMG_20171012_192925459.jpg","https://www.tenerifeon.es/images/Senderos/PNT_04.1_Ramal_Portillo_Alto/opt-P1000998.jpg","https://www.tenerifeon.es/images/Senderos/PNT_04.1_Ramal_Portillo_Alto/opt-P1010012.jpg"],"region":"PNT-04.1 Nationalpark Teide","permit":"","notice":""},{"name":"PNT 05 Degollada de Guajara","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-05-degollada-de-guajara","distance_km":null,"rating":3,"difficulty":"High","description":"This is the only trail that takes you over the walls of the caldera and is part of the old Camino de Chasna, which used to link the two sides of the island. The trail ascends from La Cañada del Montón de Trigo to the pass between the mountains of Pasajirón and Guajara. The view from this point is spectacular, with wide panoramic views of the National Park and the southern slopes of Tenerife.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_05_Degollada_de_Guajara/opt-04_Teide5DegolladaGuajara2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_05_Degollada_de_Guajara/opt-deporte_senderismo_5._Degollada_de_Guajara__parque_nacional_teide_volcanes_Panorama_2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_05_Degollada_de_Guajara/opt-deporte_senderismo_5._Degollada_de_Guajara__parque_nacional_teide_volcanes__NDR3646.jpg","https://www.tenerifeon.es/images/Senderos/PNT_05_Degollada_de_Guajara/opt-deporte_senderismo_5._Degollada_de_Guajara__parque_nacional_teide_volcanes__NDR3676.jpg"],"region":"PNT-05 Nationalpark Teide","permit":"","notice":""},{"name":"PNT 06 Montaña de los Tomillos","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-06-montana-de-los-tomillos","distance_km":null,"rating":2.5,"difficulty":"Medium","description":"The trail can be started at the El Portillo Visitor Centre (in which case the first 20 minutes of the route are shared with the PNT 01 La Fortaleza trail, before the two trails separate at a junction near Roque del Peral), or in the opposite direction, in which case it is essential to follow the initial section of the PNT 07 trail (Montaña Blanca - La Rambleta).","photos":["https://www.tenerifeon.es/images/Senderos/PNT_06_Montan%CC%83a_de_los_Tomillos/opt-P1000567.jpg","https://www.tenerifeon.es/images/Senderos/PNT_06_Montan%CC%83a_de_los_Tomillos/opt-P1000514.jpg","https://www.tenerifeon.es/images/Senderos/PNT_06_Montan%CC%83a_de_los_Tomillos/opt-P1000520.jpg","https://www.tenerifeon.es/images/Senderos/PNT_06_Montan%CC%83a_de_los_Tomillos/opt-P1000574.jpg"],"region":"PNT-06 Nationalpark Teide","permit":"","notice":""},{"name":"PNT 07 Montaña Blanca - La Rambleta (Upper cable car station)","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-07-montana-blanca-la-rambleta","distance_km":4.6,"rating":3.5,"difficulty":"High","description":"To follow this trail, prior authorisation must be requested on this same page. Check the mandatory equipment required to use this trail at the following link. This trail sets off along the Montaña Blanca track, an example of explosive volcanic eruptions that emit pumice stone. The old footpath to the peak begins when you reach the slopes of Mount Teide. It climbs steeply, with a gradient of over 60% in some parts, via Lomo Tieso to the Altavista Refuge.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_07_Montan%CC%83a_Blanca_La_Rambleta/opt-04_Teide7Montan%CC%83aBlancaTeide4.jpg","https://www.tenerifeon.es/images/Senderos/PNT_07_Montan%CC%83a_Blanca_La_Rambleta/opt-04_Teide7Montan%CC%83aBlancaTeide.jpg","https://www.tenerifeon.es/images/Senderos/PNT_07_Montan%CC%83a_Blanca_La_Rambleta/opt-04_Teide7Montan%CC%83aBlancaTeide3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_07_Montan%CC%83a_Blanca_La_Rambleta/opt-04_Teide7Montan%CC%83aBlancaTeide6.jpg","https://www.tenerifeon.es/images/Senderos/PNT_07_Montan%CC%83a_Blanca_La_Rambleta/opt-07_Teide7Cono.jpg","https://www.tenerifeon.es/images/Senderos/PNT_07_Montan%CC%83a_Blanca_La_Rambleta/opt-deporte_senderismo__7._Montan%CC%83a_Blanca-Pico_del_Teide_parque_nacional_volcanes__NDR4215.jpg"],"region":"PNT-07 Montaña Blanca - La Rambleta","permit":"","notice":""},{"name":"PNT 07.1 Montaña Blanca Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-07-1-montana-blanca-spur-trail","distance_km":null,"rating":3.5,"difficulty":"High","description":"A short trail that branches off from the PNT 07 Montaña Blanca - La Rambleta trail to climb to the top of Montaña Blanca, with impressive views of the Teide National Park and the southern slopes of the island.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_07.1_Ramal_al_alto_de_Montan%CC%83a_Blanca/opt-Ramal_alto_de_Montan%CC%83a_Blanca_y_sendero_7.jpg"],"region":"PNT-07.1 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 09 Teide - Pico Viejo - Mirador de Las Narices del Teide","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-09-teide-pico-viejo-mirador-de-las-narices-del-teide","distance_km":null,"rating":3,"difficulty":"High","description":"To follow this trail, prior authorisation must be requested on this same page. Check the mandatory equipment required to use this trail at the following link. This trail takes you through the lava flows ejected by Mount Teide during its last eruption during the Middle Ages. Along the way you will see the spectacular 800-metre wide crater of Pico Viejo and the volcanic vents of Las Narices del Teide, from the last eruption that occurred in the National Park in 1798.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_09_Pico_Viejo_Mirador_Las_Narices_del_Teide/opt-04_Teide9TeidePicoViejoTF38c.jpg","https://www.tenerifeon.es/images/Senderos/PNT_09_Pico_Viejo_Mirador_Las_Narices_del_Teide/opt-04_Teide9TeidePicoViejoTF38d.jpg","https://www.tenerifeon.es/images/Senderos/PNT_09_Pico_Viejo_Mirador_Las_Narices_del_Teide/opt-07_Teide9Mirador.jpg","https://www.tenerifeon.es/images/Senderos/PNT_09_Pico_Viejo_Mirador_Las_Narices_del_Teide/opt-07_Teide9Pico.jpg","https://www.tenerifeon.es/images/Senderos/PNT_09_Pico_Viejo_Mirador_Las_Narices_del_Teide/opt-59.jpg"],"region":"PNT-09 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 10 Telesforo Bravo","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-10-telesforo-bravo","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"Check the mandatory equipment required to use this trail at the following link. This restricted trail, which you can only do with prior authorisation, will take you from La Rambleta to the summit of Mount Teide. Although it is short and well-maintained, the steepness of this trail makes it very challenging. It has gradients of up to 60% and starts at an altitude of 3,550 m above sea level.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_10_Telesforo_Bravo/opt-04_Teide10TelesforoBravo6.jpg","https://www.tenerifeon.es/images/Senderos/PNT_10_Telesforo_Bravo/opt-04_Teide10TelesforoBravo3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_10_Telesforo_Bravo/opt-Sendero_Telesforo_Bravo.jpg","https://www.tenerifeon.es/images/Senderos/PNT_10_Telesforo_Bravo/opt-Sendero_Telesforo_Bravo_2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_10_Telesforo_Bravo/opt-Sendero_Telesforo_Bravo_6.jpg"],"region":"PNT-10 Parque Nacional del Teide","permit":"required","notice":""},{"name":"PNT 11 Mirador de la Fortaleza (Fortaleza Viewpoint)","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-11-mirador-de-la-fortaleza","distance_km":null,"rating":4.5,"difficulty":"Medium","description":"This short and well-maintained route takes you from La Rambleta to the La Fortaleza viewpoint where you can enjoy views of the north of the National Park and the island. Weather permitting, the viewpoint offers breathtaking views with the crags of La Fortaleza towering in the foreground. This formidable reddish-coloured rocky outcrop is the result of highly viscous phonolitic lava accumulating after spewing from a volcanic vent.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_11_Mirador_de_la_Fortaleza/opt-Sendero_Mirador_de_la_Fortaleza.jpg","https://www.tenerifeon.es/images/Senderos/PNT_11_Mirador_de_la_Fortaleza/opt-Sendero_Mirador_de_la_Fortaleza_2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_11_Mirador_de_la_Fortaleza/opt-Sendero_Mirador_de_la_Fortaleza_3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_11_Mirador_de_la_Fortaleza/opt-Sendero_Mirador_de_la_Fortaleza_4.jpg"],"region":"PNT-11 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 12 La Rambleta - Mirador de Pico Viejo (Pico Viejo Viewpoint)","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-12-mirador-de-pico-viejo","distance_km":null,"rating":3,"difficulty":"Medium","description":"This trail through fumaroles and otherworldly landscapes is a journey through the park’s ancient volcanic eruptions. The well-maintained path takes you a short distance from La Rambleta, where the Teide cable car terminus is located, to the Pico Viejo viewpoint. However, the high altitude means less oxygen, so walking it can be tiring. We recommend that you proceed slowly and take as many breaks as you need on your ascent.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_12_Mirador_Pico_Viejo/opt-Sendero_Mirador_de_Pico_Viejo_3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_12_Mirador_Pico_Viejo/opt-Panorama_sin_ti%CC%81tulo3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_12_Mirador_Pico_Viejo/opt-Sendero_Mirador_de_Pico_Viejo_2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_12_Mirador_Pico_Viejo/opt-Sendero_Mirador_de_Pico_Viejo_4.jpg","https://www.tenerifeon.es/images/Senderos/PNT_12_Mirador_Pico_Viejo/opt-Sendero_Mirador_de_Pico_Viejo_5.jpg","https://www.tenerifeon.es/images/Senderos/PNT_12_Mirador_Pico_Viejo/opt-_img1364.jpg"],"region":"PNT-12 Nationalpark Teide","permit":"","notice":""},{"name":"PNT 13 Sámara Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-13-samara","distance_km":4.59,"rating":3.5,"difficulty":"Low","description":"This loop trail, which starts at the foot of the Sámara volcano, offers beautiful panoramic views of several volcanic cones. The entire route takes you over dark-coloured layers of tephra (volcanic material) and is relatively flat with a few gentle slopes.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_13_Samara/opt-_NDR3220.jpg","https://www.tenerifeon.es/images/Senderos/PNT_13_Samara/opt-deporte_senderismo_13._Samara__parque_nacional_teide_volcanes_Panorama_sin_ti%CC%81tulo.jpg","https://www.tenerifeon.es/images/Senderos/PNT_13_Samara/opt-_NDR3171.jpg","https://www.tenerifeon.es/images/Senderos/PNT_13_Samara/opt-_NDR3209.jpg","https://www.tenerifeon.es/images/Senderos/PNT_13_Samara/opt-_NDR3221.jpg"],"region":"PNT-13 Nationalpark Teide","permit":"","notice":""},{"name":"PNT 13.1 Alto de Sámara Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-13-1-ramal-samara","distance_km":null,"rating":5,"difficulty":"Medium","description":"A short 360-metre branch at the start of the PNT 13 (Sámara) trail that takes you up to the summit of the Sámara volcano. From there you will be rewarded with sweeping, spectacular panoramic views of several volcanic cones, as well as Mount Teide and Pico Viejo.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_13_Samara/opt-_NDR3171.jpg"],"region":"PNT-13.1 Teide National Park","permit":"","notice":""},{"name":"PNT 14 Alto de Guamaso Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-14-alto-de-guamaso","distance_km":2.86,"rating":3,"difficulty":"Medium","description":"This is an easy trail with views of the Orotava Valley, often blanketed by a sea of clouds. It takes you around a beautiful volcanic cone and into its crater. The cone was formed by the accumulation of volcanic material, with striking lava bombs dotted over its slopes. This is a good place to observe the transition from Canary Island pine forest to mountain scrubland.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_14_Alto_de_Guamaso/opt-_NDR5581.jpg","https://www.tenerifeon.es/images/Senderos/PNT_14_Alto_de_Guamaso/opt-Panorama_sin_ti%CC%81tulo2_1.jpg","https://www.tenerifeon.es/images/Senderos/PNT_14_Alto_de_Guamaso/opt-_NDR5571.jpg","https://www.tenerifeon.es/images/Senderos/PNT_14_Alto_de_Guamaso/opt-_NDR5640.jpg","https://www.tenerifeon.es/images/Senderos/PNT_14_Alto_de_Guamaso/opt-_NDR5741.jpg"],"region":"PNT-14 Teide National Park","permit":"","notice":""},{"name":"PNT 15 Alto de Guajara","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-15-alto-de-guajara","distance_km":3.38,"rating":3.5,"difficulty":"High","description":"This mountain trail ascends from La Degollada de Guajara to the summit of Alto de Guajara, the highest point of the Caldera wall at 2,715m. From this spectacular vantage point, the third highest peak in the National Park, you can get the best view of the Teide, Pico Viejo and Montaña Blanca volcanoes, as well as a sweeping view of the Caldera de Las Cañadas, with its lava flows and plains.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_15_Alto_de_Guajara/opt-04_Teide15AltoGuajara.jpg","https://www.tenerifeon.es/images/Senderos/PNT_15_Alto_de_Guajara/opt-_NDR7343.jpg","https://www.tenerifeon.es/images/Senderos/PNT_15_Alto_de_Guajara/opt-_NDR7354.jpg","https://www.tenerifeon.es/images/Senderos/PNT_15_Alto_de_Guajara/opt-_NDR7423.jpg","https://www.tenerifeon.es/images/Senderos/PNT_15_Alto_de_Guajara/opt-_NDR7427.jpg","https://www.tenerifeon.es/images/Senderos/PNT_15_Alto_de_Guajara/opt-_NDR7456_1.jpg"],"region":"PNT-15 Teide National Park","permit":"","notice":""},{"name":"PNT 16 Sanatorio (Sanatorium)","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-16-sanatorio","distance_km":4.58,"rating":0,"difficulty":"Medium","description":"This trail starts at the foot of Mount Teide, the imposing presence of the peak becoming more and more spectacular as you leave the mountain behind. It runs along an old track that ends at the Siete Cañadas trail at the foot of the Guajara escarpments. Along the way, you will see the curious shapes of the lava from the Montaña Blanca volcanic dome and the beehives where the locals collect the highly prized retama (broom) honey in spring.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_16_Sanatorio/opt-Panorama_sin_2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_16_Sanatorio/opt-_NDR3461.jpg","https://www.tenerifeon.es/images/Senderos/PNT_16_Sanatorio/opt-_NDR3523.jpg","https://www.tenerifeon.es/images/Senderos/PNT_16_Sanatorio/opt-_NDR3548.jpg","https://www.tenerifeon.es/images/Senderos/PNT_16_Sanatorio/opt-_NDR3579.jpg"],"region":"PNT-16 Teide National Park","permit":"","notice":""},{"name":"PNT 17 Igueque","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-17-igueque","distance_km":2.65,"rating":0,"difficulty":"Medium","description":"This trail features contrasting views of the south side of the island, with Güimar Valley as the main feature, and the north side featuring the spectacular Orotava Valley, often blanketed by a sea of clouds. The route starts by encircling Montaña de Igueque, height 2,273m, before heading towards Montaña la Negrita, height 2,245m. Along the way you will see large lava bombs amidst the high mountain scrubland.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_17_Igueque/opt-IMG_20170923_122322861_HDR.jpg","https://www.tenerifeon.es/images/Senderos/PNT_17_Igueque/opt-IMG_20170923_104734165.jpg","https://www.tenerifeon.es/images/Senderos/PNT_17_Igueque/opt-IMG_20170923_122427338_HDR.jpg","https://www.tenerifeon.es/images/Senderos/PNT_17_Igueque/opt-IMG_20170923_123606086_HDR.jpg"],"region":"PNT-17 Teide National Park","permit":"","notice":""},{"name":"PNT 18 Chavao","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-18-chavao","distance_km":4.42,"rating":4,"difficulty":"Low","description":"This trail starts next to the Chahorra viewpoint, where you can appreciate the beauty of Pico Viejo and Las Narices del Teide. The walk is mainly flat and heads towards Roque del Cedro, leaving La Cañada del Cedro on the left.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_18_Chavao/Chavao_nuevas/IMG_4514.JPG","https://www.tenerifeon.es/images/Senderos/PNT_18_Chavao/Chavao_nuevas/IMG_4525.JPG","https://www.tenerifeon.es/images/Senderos/PNT_18_Chavao/Chavao_nuevas/IMG_4530.JPG","https://www.tenerifeon.es/images/Senderos/PNT_18_Chavao/Chavao_nuevas/IMG_4539.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/088_Museo_Juan_%C3%89vora.jpeg"],"region":"PNT-18 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 19 Majúa","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-19-majua","distance_km":4.18,"rating":0,"difficulty":"Low","description":"This trail descends gently down the slopes of Mount Teide to the Parador, located in the middle of the area known as Cañada Blanca. The path runs around the pumice cone of Montaña Majúa, then skirts the lava flows and continues through the broom scrubland of Cañada Blanca.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_19_Majua/Majua_Nuevo/IMG_4611.JPG","https://www.tenerifeon.es/images/Senderos/PNT_19_Majua/Majua_Nuevo/IMG_4604.JPG","https://www.tenerifeon.es/images/Senderos/PNT_19_Majua/Majua_Nuevo/IMG_4606.JPG","https://www.tenerifeon.es/images/Senderos/PNT_19_Majua/Majua_Nuevo/IMG_4614.JPG","https://www.tenerifeon.es/images/Senderos/PNT_19_Majua/Majua_Nuevo/IMG_4617.JPG"],"region":"PNT-19 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 20 Volcán de Fasnia (Fasnia Volcano) Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-20-volcan-de-fasnia","distance_km":null,"rating":3.5,"difficulty":"Low","description":"This trail leads you to ancient and beautiful many-hued volcanic cones and then takes you past deep black volcanic cones. These younger volcanic cones emerged during the eruption of January 1705, forming what is known today as the Fasnia Volcano. Beekeepers use the dense broom thickets and their profuse blossom to produce the highly prized broom honey, while their bees help to pollinate the local flora.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_20_Volca%CC%81n_de_Fasnia/opt-_NDR2018.jpg","https://www.tenerifeon.es/images/Senderos/PNT_20_Volca%CC%81n_de_Fasnia/opt-_NDR1971.jpg","https://www.tenerifeon.es/images/Senderos/PNT_20_Volca%CC%81n_de_Fasnia/opt-_NDR1510.jpg","https://www.tenerifeon.es/images/Senderos/PNT_20_Volca%CC%81n_de_Fasnia/opt-_NDR1400.jpg","https://www.tenerifeon.es/images/Senderos/PNT_20_Volca%CC%81n_de_Fasnia/opt-Panorama_.jpg"],"region":"PNT-20 Teide National Park","permit":"","notice":""},{"name":"PNT 21 Corral del Niño - Yegua Blanca","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-21-corral-del-nino-yegua-blanca","distance_km":null,"rating":0,"difficulty":"Low","description":"This trail takes you towards Montaña Limón along a forest track with views of volcanic cones surmounted by the outline of Mount Teide in the distance. On clear days you can also see the island of La Palma. The final stretch zigzags upwards through dense thickets of broom before reaching the TF-24 road at the rock formation known as Roque del Mal Abrigo.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_21_Corral_del_Nin%CC%83o_Yegua_Blanca/opt-2e8f3921-c174-46b5-a6ce-6d58773444bd.jpg","https://www.tenerifeon.es/images/Senderos/PNT_21_Corral_del_Nin%CC%83o_Yegua_Blanca/opt-5e1ae69e-745f-42d9-993f-2b2a1cf0c318.jpg","https://www.tenerifeon.es/images/Senderos/PNT_21_Corral_del_Nin%CC%83o_Yegua_Blanca/opt-268e51e9-154b-45c1-89ea-8c88fe263180.jpg","https://www.tenerifeon.es/images/Senderos/PNT_21_Corral_del_Nin%CC%83o_Yegua_Blanca/opt-af344e7c-d98e-48a8-b7ba-151a4008050b.jpg","https://www.tenerifeon.es/images/Senderos/PNT_21_Corral_del_Nin%CC%83o_Yegua_Blanca/opt-fe523cf0-bd83-4dbf-83ba-ee62f2fb067c.jpg"],"region":"PNT-21 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 22 Lomo Hurtado","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-22-lomo-hurtado","distance_km":null,"rating":0,"difficulty":"Low","description":"This easy trail links the upper part of the Orotava Valley with Montaña Blanca. Despite the elevation gain, the slope only climbs somewhat steeply in the upper section. And since the ground underfoot is almost entirely compacted pumice stone, the going is relatively easy. The route starts at the crossroads of PNT 01 (La Fortaleza) and PNT 25 (Recibo Quemado) from the Orotava Valley, shortly before reaching Llano de Los Guancheros.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_22_Lomo_Hurtado/opt-04_Teide22LomoHurtado3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_22_Lomo_Hurtado/opt-P1000368.jpg","https://www.tenerifeon.es/images/Senderos/PNT_22_Lomo_Hurtado/opt-P1000377.jpg","https://www.tenerifeon.es/images/Senderos/PNT_22_Lomo_Hurtado/opt-P1000388.jpg"],"region":"PNT-22 Teide National Park","permit":"","notice":""},{"name":"PNT 23 Los Regatones Negros","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-23-los-regatones-negros","distance_km":null,"rating":3.5,"difficulty":"High","description":"To follow this trail, prior authorisation must be requested on this same page. Check the mandatory equipment required to use this trail at the following link. This trail links the upper part of the PNT 03 trail with the PNT 09 trail at Degollada de Pico Viejo, also known as Degollada de Chahorra. This hike requires a certain amount of preparation, as it involves a steep climb at high altitude, reaching 3,058 m.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_23_Regatones_Negros/opt-_NDR8975.jpg","https://www.tenerifeon.es/images/Senderos/PNT_23_Regatones_Negros/opt-_NDR8817.jpg","https://www.tenerifeon.es/images/Senderos/PNT_23_Regatones_Negros/opt-07_Teide23MarNubes.jpg","https://www.tenerifeon.es/images/Senderos/PNT_23_Regatones_Negros/opt-07_Teide23Bola.jpg","https://www.tenerifeon.es/images/Senderos/PNT_23_Regatones_Negros/opt-04_Teide23RegatonesNegros4.jpg"],"region":"PNT-23 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 24 Portillo Alto","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-24-portillo-alto","distance_km":null,"rating":0,"difficulty":"Low","description":"This short trail links Portillo Alto with the PNT 01 trail (La Fortaleza), near the rock formation known as Roque del Peral. Towards the end, it crosses over the PNT 6 trail (Montaña de Los Tomillos), which climbs towards Montaña Blanca and Mount Teide. Along the way you will enjoy breathtaking panoramic views of the northern part of the Teide National Park.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_24_Portillo_Alto/opt-8a1c2df2-4105-4359-b7d1-4a0622a693a1.jpg","https://www.tenerifeon.es/images/Senderos/PNT_24_Portillo_Alto/opt-11fd1db8-185e-46ba-9dd1-0ac677afaa77.jpg","https://www.tenerifeon.es/images/Senderos/PNT_24_Portillo_Alto/opt-42ee8570-aad2-44bf-a131-cdf3a95f21cf.jpg","https://www.tenerifeon.es/images/Senderos/PNT_24_Portillo_Alto/opt-66e13190-79f2-4f0a-af53-9acb41965e4d.jpg","https://www.tenerifeon.es/images/Senderos/PNT_24_Portillo_Alto/opt-ab7ccb4c-2c4a-4318-b2b2-963a86b26cec.jpg"],"region":"PNT-24 Teide National Park","permit":"","notice":""},{"name":"PNT 24.1 Portillo Alto - El Portillo Botanical Garden Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-24-1-ramal-portillo-alto-pnt-01-jardin-botanico-el-portillo","distance_km":null,"rating":0,"difficulty":"Low","description":"This easy trail will take you to the botanical garden at El Portillo, with its wonderful collection of flora native to the Teide National Park.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_24.1_Jardi%CC%81n_Bota%CC%81nico_El_Portillo/opt-_NDR7642.jpg","https://www.tenerifeon.es/images/Senderos/PNT_24.1_Jardi%CC%81n_Bota%CC%81nico_El_Portillo/opt-_NDR7507.jpg","https://www.tenerifeon.es/images/Senderos/PNT_24.1_Jardi%CC%81n_Bota%CC%81nico_El_Portillo/opt-55af8397-a7c3-4362-8abd-b64e706c226c.jpg"],"region":"PNT-24.1 Teide National Park","permit":"","notice":""},{"name":"PNT 25 Recibo Quemado","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-25-recibo-quemado","distance_km":null,"rating":0,"difficulty":"Low","description":"This trail runs along a short section of one of the old footpaths leading up from the Orotava Valley to the mountain pastures. It links the lower boundary of the Teide National Park, near the stopping place known as Recibo Quemado on the TF-21 road, with trails PNT 01 (La Fortaleza) and PNT 22 (Lomo Hurtado). The path starts off through a Canary Island pine forest that gradually clears away until it gives way to mountain scrubland.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_25_Recibo_Quemado/opt-P1000444_946.jpg","https://www.tenerifeon.es/images/Senderos/PNT_25_Recibo_Quemado/opt-P1000447_948.jpg","https://www.tenerifeon.es/images/Senderos/PNT_25_Recibo_Quemado/opt-P1000450.jpg","https://www.tenerifeon.es/images/Senderos/PNT_25_Recibo_Quemado/opt-P1000467.jpg","https://www.tenerifeon.es/images/Senderos/PNT_25_Recibo_Quemado/opt-P1000468.jpg","https://www.tenerifeon.es/images/Senderos/PNT_25_Recibo_Quemado/opt-P1000473.jpg"],"region":"PNT-25 Teide National Park","permit":"","notice":""},{"name":"PNT 26 Ucanca","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-26-ucanca","distance_km":null,"rating":0,"difficulty":"Low","description":"This trail starts at the foot of Roque de La Catedral, from the PNT 03 trail (Roques de García), and leads into the immense plain of Llano de Ucanca. Featuring incomparable views of Mount Teide, Pico Viejo and the rugged Cumbres de Ucanca, the trail takes you over flat terrain to the beautiful Ucanca viewpoint, on the TF-21 road.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_26_Ucanca/IMG_4549.JPG","https://www.tenerifeon.es/images/Senderos/PNT_26_Ucanca/IMG_4553.JPG"],"region":"PNT-26 Teide National Park","permit":"","notice":""},{"name":"PNT 27 Montaña Rajada","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-27-montana-rajada","distance_km":2.14,"rating":0,"difficulty":"Low","description":"This trail links the PNT 07 trail (Montaña Blanca - Pico Teide) with the PNT 06 trail (Montaña de Los Tomillos), bordering the domes of Montaña Blanca and Montaña Rajada. It offers spectacular views of the two volcanic peaks and crosses a terrain blanketed in pumice stone from the violent eruptions of Montaña Blanca.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_27_Montan%CC%83a_Rajada/opt-Panorama_sin_ti%CC%81tulo13.jpg","https://www.tenerifeon.es/images/Senderos/PNT_27_Montan%CC%83a_Rajada/opt-_NDR5449.jpg","https://www.tenerifeon.es/images/Senderos/PNT_27_Montan%CC%83a_Rajada/opt-_NDR5508.jpg","https://www.tenerifeon.es/images/Senderos/PNT_27_Montan%CC%83a_Rajada/opt-_NDR5617.jpg","https://www.tenerifeon.es/images/Senderos/PNT_27_Montan%CC%83a_Rajada/opt-_NDR5679.jpg","https://www.tenerifeon.es/images/Senderos/PNT_27_Montan%CC%83a_Rajada/opt-_NDR5768.jpg"],"region":"PNT-27 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 28 Chafarí","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-28-chafari","distance_km":null,"rating":3,"difficulty":"Medium","description":"To follow this trail, prior authorisation must be requested on this same page. Check the mandatory equipment required to use this trail at the following link. This trail climbs the slopes of Pico Viejo from the TF-38 road, just over a kilometre from Boca Tauce. It runs for the most part along the dirt track known as “Los Chircheros”, ascending through a landscape of abundant broom that has colonised the lava flows that descended from the top of Pico Viejo.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_28_Chafari%CC%81/opt-07_Teide28Escarpes.jpg","https://www.tenerifeon.es/images/Senderos/PNT_28_Chafari%CC%81/opt-07_Teide28Bola.jpg","https://www.tenerifeon.es/images/Senderos/PNT_28_Chafari%CC%81/opt-PB180435.jpg","https://www.tenerifeon.es/images/Senderos/PNT_28_Chafari%CC%81/opt-PB180451.jpg","https://www.tenerifeon.es/images/Senderos/PNT_28_Chafari%CC%81/opt-PB180573.jpg","https://www.tenerifeon.es/images/Senderos/PNT_09_Pico_Viejo_Mirador_Las_Narices_del_Teide/opt-59.jpg"],"region":"PNT-28 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 28.1 Chafarí Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-28-1-degollada-de-chafari","distance_km":null,"rating":0,"difficulty":"Low","description":"This short branch off the PNT 28 trail (Chafarí) takes you to La Degollada del Chafarí, an impressive depression in the landscape tinged in dark volcanic colours.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_28.1_Degollada_de_Chafari%CC%81/PNT_28_1_Ramal_de_Chafari-1.jpg","https://www.tenerifeon.es/images/Senderos/PNT_28.1_Degollada_de_Chafari%CC%81/PNT_28_1_Ramal_de_Chafari-2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_28.1_Degollada_de_Chafari%CC%81/PB180429-Inicio-Chafari%CC%81-compressed.jpg"],"region":"PNT-28.1 Teide National Park","permit":"","notice":""},{"name":"PNT 29 Degollada del Cedro","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-29-degollada-del-cedro","distance_km":null,"rating":0,"difficulty":"Low","description":"This beautiful panoramic route connects the PNT 01 trail (La Fortaleza) with the PR TF 41 trail (Route 0-4-0) at the edge of the National Park. It starts in Llano de Los Guancheros or Los Rastrojos, at the foot of El Cabezón, and climbs up to Degollada del Cedro between two scarps of the Las Cañadas caldera known as El Cabezón and La Fortaleza. From here it continues along a forest track down the Tigaiga mountainside to the edge of the Teide National Park.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_29_Degollada_del_Cedro/opt-P1010045.jpg","https://www.tenerifeon.es/images/Senderos/PNT_29_Degollada_del_Cedro/opt-P1010040.jpg","https://www.tenerifeon.es/images/Senderos/PNT_29_Degollada_del_Cedro/opt-P1010041.jpg","https://www.tenerifeon.es/images/Senderos/PNT_29_Degollada_del_Cedro/opt-P1010044.jpg"],"region":"PNT-29 Teide National Park","permit":"","notice":""},{"name":"PNT 30 Los Valles","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-30-los-valles","distance_km":4.86,"rating":0,"difficulty":"Low","description":"This easy trail descends from Las Minas de San José, in the centre of the National Park, to the foot of Risco Verde, in La Cañada de Las Pilas. The first section of the route passes through an area where pumice stone was mined for several decades, and then begins the descent through Los Valles until it reaches La Cañada de Las Pilas, at the foot of the walls of the Las Cañadas caldera.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_30_Los_Valles/opt-15.jpg","https://www.tenerifeon.es/images/Senderos/PNT_30_Los_Valles/opt-04_Teide30LosValles3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_30_Los_Valles/opt-14.jpg","https://www.tenerifeon.es/images/Senderos/PNT_30_Los_Valles/opt-16.jpg","https://www.tenerifeon.es/images/Senderos/PNT_30_Los_Valles/opt-PA120705.jpg"],"region":"PNT-30 Teide National Park","permit":"","notice":""},{"name":"PNT 31 Cumbres de Ucanca","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-31-cumbres-de-ucanca","distance_km":null,"rating":4,"difficulty":"High","description":"This trail offers uninterrupted views of the interior of the Las Cañadas caldera and the southern slopes of the island. Highlights include Mount Teide and Pico Viejo, and the short tongue of lava known as El Sombrero de Chasna. The route begins in the area of El Capricho, as it leaves the PNT 04 trail (Siete Cañadas) and climbs an old and winding path up to La Degollada de Ucanca. This first stretch of the trail has an elevation gain of nearly 300 metres.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_31_Cumbres_de_Ucanca/opt-04_Teide31CumbresUcanca3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_31_Cumbres_de_Ucanca/opt-04_Teide31CumbresUcanca2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_31_Cumbres_de_Ucanca/opt-04_Teide31CumbresUcanca5.jpg","https://www.tenerifeon.es/images/Senderos/PNT_31_Cumbres_de_Ucanca/opt-PC030459.jpg","https://www.tenerifeon.es/images/Senderos/PNT_31_Cumbres_de_Ucanca/opt-PC030526.jpg"],"region":"PNT-31 Teide National Park","permit":"","notice":""},{"name":"PNT 31.1 Lomo Los Pegueros Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-31-1-ramal-del-lomo-los-pegueros","distance_km":null,"rating":0,"difficulty":"Medium","description":"A short spur trail that will take you to El Lomo Los Pegueros from the PNT 31 trail (Cumbres de Ucanca). Although it is barely half a kilometre long, its steep slope together with the altitude of the trail make this a challenging route.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_31.1_Ramal_Lomo_los_Pegueros/65d5210c-5178-46d4-9e01-7ae8d16db11c.jpg","https://www.tenerifeon.es/images/Senderos/PNT_31.1_Ramal_Lomo_los_Pegueros/cdf00d65-1a6e-4dd0-bd30-07a28ca55edf.jpg"],"region":"PNT-31.1 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 31.2 Ramal Degollada del Sombrero de Chasna","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-31-2-ramal-degollada-del-sombrero-de-chasna","distance_km":null,"rating":0,"difficulty":"High","description":"Spur trail that takes you into El Sombrero de Chasna, a short tongue of lava that forms one of the most distinctive peaks in the south of the island. It owes its name to the curious hat-like shape of its rock wall rising up towards the sky. From its summit you can enjoy spectacular views of Mount Teide and Las Cañadas.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_31.2_Ramal_Degollada_del_Sombrero_de_Chasna/opt-PC030774.jpg","https://www.tenerifeon.es/images/Senderos/PNT_31.2_Ramal_Degollada_del_Sombrero_de_Chasna/opt-PC030749.jpg"],"region":"PNT-31.2 Teide National Park","permit":"","notice":""},{"name":"PNT 32 Abeque","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-32-abeque","distance_km":2.42,"rating":0,"difficulty":"Low","description":"This easy trail connects the south-western part of the Teide National Park from the Sámara viewpoint to the lower part of the PNT 09 trail. The route runs along one of the old footpaths that climbed to the top of the island and crosses a landscape covered mainly with recent volcanic materials from the nearby cones.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_32_Abeque/opt-_NDR9581.jpg","https://www.tenerifeon.es/images/Senderos/PNT_32_Abeque/opt-_NDR9565.jpg","https://www.tenerifeon.es/images/Senderos/PNT_32_Abeque/opt-_NDR0646.jpg","https://www.tenerifeon.es/images/Senderos/PNT_32_Abeque/opt-_NDR0625.jpg","https://www.tenerifeon.es/images/Senderos/PNT_32_Abeque/opt-_NDR0531.jpg"],"region":"PNT-32 Teide National Park","permit":"","notice":""},{"name":"PNT 33 Montaña Negra","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-33-montana-negra","distance_km":3.17,"rating":0,"difficulty":"Low","description":"This trail runs along the upper section of an old footpath from La Guancha, San Juan de La Rambla and Icod el Alto. It links the PNT 01 trail (La Fortaleza) at the foot of the westernmost ridges near the edge of the National Park with the PNT 22 trail (Lomo Hurtado) that descends from Montaña Blanca. The route runs past the foot of the steep slopes of Mount Teide and skirts the volcanic cone known as Montaña Negra.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_33_Montan%CC%83a_Negra/opt-P1000717.jpg","https://www.tenerifeon.es/images/Senderos/PNT_33_Montan%CC%83a_Negra/opt-P1000723.jpg","https://www.tenerifeon.es/images/Senderos/PNT_33_Montan%CC%83a_Negra/opt-P1000749.jpg","https://www.tenerifeon.es/images/Senderos/PNT_33_Montan%CC%83a_Negra/opt-P1000754.jpg","https://www.tenerifeon.es/images/Senderos/PNT_33_Montan%CC%83a_Negra/opt-P1000756.jpg","https://www.tenerifeon.es/images/Senderos/PNT_33_Montan%CC%83a_Negra/opt-P1000762.jpg"],"region":"PNT-33 Teide National Park","permit":"","notice":""},{"name":"PNT 34 Montaña Limón","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-34-montana-limon","distance_km":null,"rating":0,"difficulty":"Low","description":"This short trail runs along an old footpath that used to link the two great valleys of Güímar and La Orotava. The route sets off from the heights of La Orotava, on the edge of the Teide National Park, and ascends along the southern slopes of Montaña Limón until it joins the PNT 21 trail (Corral del Niño - Yegua Blanca), which climbs up to La Piedra del Mal Abrigo.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_34_Montan%CC%83a_Limo%CC%81n/op-85edb822-05f9-4615-9881-3dd4d343cf87.JPG","https://www.tenerifeon.es/images/Senderos/PNT_34_Montan%CC%83a_Limo%CC%81n/op-0c9ff597-59ff-40e9-8fe6-937188a9d7d1.JPG","https://www.tenerifeon.es/images/Senderos/PNT_34_Montan%CC%83a_Limo%CC%81n/op-7081bac0-4fb2-4869-b540-04973fe5d7bd-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PNT_34_Montan%CC%83a_Limo%CC%81n/op-IMG_20181126_144516910_HDR-compressed.jpg"],"region":"PNT-34 Teide National Park","permit":"","notice":""},{"name":"PNT 35 Boca Chavao","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-35-boca-chavao","distance_km":null,"rating":0,"difficulty":"Low","description":"This trail used to be the main way up to the top of the island for the inhabitants of Isora, with branches leading to it from various hamlets. The route follows the section of the footpath that is within the limits of the Teide National Park, while th
