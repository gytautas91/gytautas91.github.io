s short, pleasant trail of just 1.4 km connects the Las Cuevecitas neighbourhood with the other routes of the Local Trails Network of Candelaria. The trail sets off from Plaza de las Cuevecitas and takes Calle La Hoya to head towards the Barranco de El Rincón ravine along a narrow, winding path that traces the features of the landscape.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_296.1_Barranco_el_Rincon/_NDR7748.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.1_Barranco_el_Rincon/_NDR7692.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.1_Barranco_el_Rincon/_NDR7746.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.1_Barranco_el_Rincon/_NDR7766.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.1_Barranco_el_Rincon/Panorama_sin_t%C3%ADtulo5.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.1_Barranco_el_Rincon/Panorama_sin_t%C3%ADtulo6.JPG"],"region":"SL-TF 296.1 Valle de Güímar","permit":"","notice":""},{"name":"SL TF 296.2 Barranco Chacorche","url":"https://www.tenerifeon.es/en/routes/hiking/barranco-chacorche-2","distance_km":2.53,"rating":0,"difficulty":"Medium","description":"The trail that runs through the beautiful Barranco de Chacorche takes you into a place full of contrast, light and nature in its purest form. Water, a constant presence along the route, is the main reason for the steepness of the slopes and cliffs. It is also the reason for the well and four water galleries located in the ravine. To reach the trail, head from Plaza de Ajoreña in Igueste de Candelaria towards Calle Los Revolcaderos.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_296.2_Barranco_de_Chacorche/_NDR0827.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.2_Barranco_de_Chacorche/_NDR0591.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.2_Barranco_de_Chacorche/_NDR0798.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.2_Barranco_de_Chacorche/_NDR0853.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.2_Barranco_de_Chacorche/_NDR0933.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296.2_Barranco_de_Chacorche/_NDR0962.JPG"],"region":"SL-TF 296.2 Valle de Güímar","permit":"","notice":""},{"name":"SL TF 299 Lomo Centeno","url":"https://www.tenerifeon.es/en/routes/hiking/lomo-centeno-2","distance_km":null,"rating":0,"difficulty":"Medium","description":"The traditional footpath that links Barranco Hondo with Las Lagunetas del Rosario takes you into the Las Lagunetas Protected Natural Area and its beautiful pine forest. Along the way you can see the marks left by the extraction of pine tar on some of the oldest trees. You can also see some of the native and endemic species of flora and fauna typical of the mountain vegetation found in this part of the island.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_299_Lomo_Centeno/Panorama_sin_t%C3%ADtulo9.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_299_Lomo_Centeno/Panorama_sin_t%C3%ADtulo10.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_299_Lomo_Centeno/_NDR1093.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_299_Lomo_Centeno/_NDR1132.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_299_Lomo_Centeno/_NDR1186.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_299_Lomo_Centeno/_NDR1208.jpg"],"region":"SL-TF 299 Las Lagunetas","permit":"","notice":""},{"name":"SL TF 301 – Las Barreras Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-301-las-barreras-loop-trail","distance_km":null,"rating":0,"difficulty":"Medium","description":"This circular route of just over 6 km allows you to explore the agricultural heritage and scrubland landscape in the south of the municipality of El Rosario. The trail begins and ends at the Chapel of Nuestra Señora del Rosario, taking you on an immersive journey into the nature and heritage of the area. From the chapel, take Camino de La Vegueta in a northerly direction, where you will begin a gentle ascent of about 30 minutes.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_301/SL_301_1.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301/SL_301_2.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301/SL_301_3.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301/SL_301_4.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301/SL_301_5.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301/SL_301_6.jpg"],"region":"SL TF 301 Las Barreras, El Rosario.","permit":"","notice":""},{"name":"SL TF 301.1 Las Barreras - Las Raíces","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-301-1-las-barreras-las-raices","distance_km":null,"rating":0,"difficulty":"Low","description":"Short, peaceful walk between Las Barreras and Las Raíces that takes you from scrubland into a lush Canary Island pine forest. The path sets off from the highest part of Las Barreras, turning left from the SL TF 301 loop trail. It starts by climbing through dense scrubland which, as you gain altitude, gives way to the majestic Canary Island pine forest. This route ends at the La Esperanza campsite, where you can connect with the PR TF 25.1 Las Raíces Loop Trail.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_301.1/SL_TF_301.1_7.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301.1/SL_301.1_1.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301.1/SL_TF_301.1_2.jpeg","https://www.tenerifeon.es/images/Senderos/SL_TF_301.1/SL_TF_301.1_3.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301.1/SL_TF_301.1_4.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_301.1/SL_TF_301.1_5.jpg"],"region":"SL TF 301.1 Las Barreras, El Rosario.","permit":"","notice":""},{"name":"SL TF 302 Las Erillas Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-302-las-erillas-loop-trail","distance_km":2.87,"rating":0,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_302/SL_TF_302_1.jpeg","https://www.tenerifeon.es/images/Senderos/SL_TF_302/SL_TF_302_2.jpeg","https://www.tenerifeon.es/images/Senderos/SL_TF_302/SL_TF_302_3.jpeg","https://www.tenerifeon.es/images/Senderos/SL_TF_302/SL_TF_302_4.jpeg","https://www.tenerifeon.es/images/Senderos/SL_TF_302/SL_TF_302_5.jpeg","https://www.tenerifeon.es/images/Senderos/SL_TF_302/SL_TF_302_6.jpeg"],"region":"SL TF 302 La Esperanza","permit":"","notice":""},{"name":"SL TF 71 Camino de la Virgen","url":"https://www.tenerifeon.es/en/routes/hiking/sendero-sl-tf-71-camino-de-la-virgen-2","distance_km":2.08,"rating":3,"difficulty":"Low","description":"Camino de la Virgen, also known as Camino de la Encarnación, is an ideal footpath for walking in the early hours of the day or at dusk, when the sunlight enhances the reddish colour of the terrain.","photos":["https://www.tenerifeon.es/images/Senderos/Camino_de_la_Virgen/Enramada.jpg","https://www.tenerifeon.es/images/Senderos/Camino_de_la_Virgen/Sitio_de_la_Era.jpg","https://www.tenerifeon.es/images/Senderos/Camino_de_la_Virgen/Enramada_2.jpg"],"region":"SL-TF 71 Fañabé","permit":"","notice":""},{"name":"SL TF 81 Camino de La Orilla del Monte Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-81-camino-de-la-orilla-del-monte","distance_km":null,"rating":3.5,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_81_Camino_de_la_Orilla_al_Monte/opt-_NDR1688.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_81_Camino_de_la_Orilla_al_Monte/opt-_NDR1671.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_81_Camino_de_la_Orilla_al_Monte/opt-_NDR1646.jpeg","https://www.tenerifeon.es/images/Senderos/SL_TF_81_Camino_de_la_Orilla_al_Monte/opt-_NDR1613.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_81_Camino_de_la_Orilla_al_Monte/opt-_NDR1578.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_81_Camino_de_la_Orilla_al_Monte/opt-_NDR1565.jpg"],"region":"SL-TF 81 Aguamansa","permit":"","notice":""},{"name":"SL TF 81.1 Orilla del Monte - Pista Benijos Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-81-1-conexion-orilla-del-monte-pista-de-benijos","distance_km":null,"rating":4.5,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_81.1_Conexion_La_Orilla_del_Monte/Nuevas_de_Enrique/25_SL_TF_81.1_CONEXION_LA_ORRILLA_DEL_MONTE-1.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_81.1_Conexion_La_Orilla_del_Monte/Nuevas_de_Enrique/25_SL_TF_81.1_CONEXION_LA_ORRILLA_DEL_MONTE-2.jpg"],"region":"SL-TF 81.1 Aguamansa","permit":"","notice":""},{"name":"SL TF 900 Montaña Grande Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/circular-de-montana-grande-2","distance_km":3.48,"rating":2.5,"difficulty":"Medium","description":"This trail takes you around Montaña Grande, an imposing 276-metre high volcanic cone that formed in an eruption that took place less than 10,000 years ago. This evocative volcano is notable for its asymmetrical profile and is located within the Malpaís de Güímar Special Nature Reserve, an area of great ecological importance due to its natural diversity and the presence of endemic species.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Montana_Grande/Sendero_Circular_Montana_Grande.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Se%C3%B1al_Malpa%C3%ADs_de_G%C3%BC%C3%ADmar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Montana_Grande/Montana_Grande.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Montana_Grande/Montana_Grande_2.jpg"],"region":"SL-TF 900 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 900.1 Montaña Grande – Camino del Socorro Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-900-1-montana-grande-camino-del-socorro-spur-trail","distance_km":null,"rating":0,"difficulty":"Very low","description":"Short trail of less than 500 metres that connects SL TF 903 El Socorro – Montaña Grande (in the section of Camino del Socorro designated as Heritage of Cultural Interest (BIC)) with the SL TF 900 Montaña Grande Loop Trail, at its north-eastern end. This trail is useful for combing different routes in Malpaís de Güímar.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Montana_Grande/Montana_Grande.jpg"],"region":"SL-TF 900.1 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 900.2 Montaña Grande - SL TF 904 second Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-900-2-second-trail-connection-montana-grande-with-trail-sl-tf-904","distance_km":null,"rating":0,"difficulty":"Very low","description":"A trail of about 350 metres that connects the SL TF 900 Montaña Grande Loop Trail with the first third of SL TF 904 Camino del Socorro – Punta de los Picos. This option provides direct access to different areas of the Malpaís from the north-eastern slope of the volcanic cone.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Sendero_Circular_del_Malpa%C3%ADs_de_Guimar.jpg"],"region":"SL-TF 900.2 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 900.3 Montaña Grande - SL TF 904 first Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-900-3-trail-connecting-montana-grande-and-sl-tf-904","distance_km":null,"rating":0,"difficulty":"Low","description":"A very short section, less than 400 metres, which connects the SL TF 900 Montaña Grande Loop Trail with SL TF 904 Camino del Socorro – Punta de los Picos. It provides a simple and practical link between routes within Malpaís de Güímar, specifically on the eastern side of the Montaña Grande volcano.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Montana_Grande/Montana_Grande_2.jpg"],"region":"SL-TF 900.3 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 900.4 Montaña Grande - SL TF 902 Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-900-4-trail-connecting-montana-grande-and-sl-tf-902","distance_km":null,"rating":0,"difficulty":"Very low","description":"A short section of less than 100 metres that provides alternative access to SL TF 902 Montaña Grande – Puertito de Güímar (Camino de Samarines), from the south-eastern slope of the SL TF 900 Montaña Grande Loop Trail. Useful as a quick detour or short cut to the coast.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Montana_Grande/Sendero_Circular_Montana_Grande.jpg"],"region":"SL-TF 900.4 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 901 El Socorro - Puertito de Güímar, Camino de La Mar","url":"https://www.tenerifeon.es/en/routes/hiking/camino-de-la-mar-2","distance_km":4.31,"rating":4,"difficulty":"Low","description":"A well-defined footpath that runs the length of the coastline of Malpaís de Güímar, linking up Socorro and Puertito de Güímar, which lie at either end of this natural area. The arid landscape was shaped by the eruption of the Montaña Grande volcano some 10,000 years ago, which produced blocky malpaís and ropy lava fields, lava tubes and jameos (openings in lava tubes).","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Camino_del_Mar/Sendero_Camino_del_Mar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Se%C3%B1al_Malpa%C3%ADs_de_G%C3%BC%C3%ADmar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Camino_del_Mar/Camino_de_la_Mar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Camino_del_Mar/Camino_de_la_Mar_2.jpg"],"region":"SL-TF 901 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 902 Puertito de Güímar - Montaña Grande. Camino de Samarines","url":"https://www.tenerifeon.es/en/routes/hiking/camino-de-samarines-2","distance_km":null,"rating":3,"difficulty":"Low","description":"This trail starts at Puertito de Güímar and heads into the Malpaís de Güímar Special Nature Reserve until it reaches the slopes of Montaña Grande, near the Morras del Corcho viewpoint. The route gives you a close-up view of the recent lava flows (less than 10,000 years old) that run from the main cone of Montaña Grande to the sea and shows you how nature has managed to adapt and thrive in this place, in an environment that appears hostile but is full of life.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Camino_de_Samarines_Guimar/Sendero_Camino_Samarines_Malpais_Guimar_ok.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Se%C3%B1al_Malpa%C3%ADs_de_G%C3%BC%C3%ADmar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Camino_de_Samarines_Guimar/Samarines.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Camino_de_Samarines_Guimar/Samarines_2.jpg"],"region":"SL-TF 902 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 903 El Socorro - Montaña Grande. Tramo BIC Camino del Socorro","url":"https://www.tenerifeon.es/en/routes/hiking/camino-del-socorro-parcial-2","distance_km":null,"rating":0,"difficulty":"Low","description":"This short section runs along the final part of Camino del Socorro, a historic route with the status of Asset of Cultural Interest that is used by participants in the Romería del Socorro pilgrimage that takes place every year in the early hours of 7 to 8 September. The trail starts at the bridge over the TF-1 motorway (Autopista del Sur), and descends Camino del Socorro, skirting the Güímar industrial estate.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Camino_del_Socorro_Parcial/Sendero_Camino_del_Socorro_Parcial.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Se%C3%B1al_Malpa%C3%ADs_de_G%C3%BC%C3%ADmar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Camino_del_Socorro_Parcial/Socorro.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Camino_del_Socorro_Parcial/Socorro_2.jpg"],"region":"SL-TF 903 Malpaís de Güímar","permit":"","notice":""},{"name":"SL TF 904 Camino del Socorro - Punta de los Picos","url":"https://www.tenerifeon.es/en/routes/hiking/sl-tf-904-camino-del-socorro-punta-de-los-picos","distance_km":2.37,"rating":0,"difficulty":"Low","description":"This route runs across the flatter area of Malpaís de Güímar and takes you on a journey back in time through one of the most unique landscapes on the coast of Tenerife. Along the way you will come across traces of human activity that stand in contrast to the southern sector of this volcanic landscape, which has remained practically untouched since the volcanic eruption that took place more than 10,000 years ago.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Circular_Malpais_de_guimar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Inicio_El_Socorro_G%C3%BC%C3%ADmar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Sendero_Circular_del_Malpa%C3%ADs_de_Guimar.jpg","https://www.tenerifeon.es/images/Senderos/Sendero_Circular_Malpa%C3%ADs_de_Guimar/Se%C3%B1al_Malpa%C3%ADs_de_G%C3%BC%C3%ADmar.jpg"],"region":"SL-TF 904 Malpaís de Güímar","permit":"","notice":""},{"name":"Taganana Interpreted Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sia-pra-01-sendero-interpretado-taganana","distance_km":null,"rating":2.5,"difficulty":"Low","description":"This trail leads you into Taganana, an old village with a fascinating past linked to the economic cycles of sugar and wine exportation. Its urban centre is located within the Tenerife Protected Natural Area and some of its most representative buildings have been designated Heritage of Cultural Interest.","photos":["https://www.tenerifeon.es/images/Puntos_de_Inter%C3%A9s/P1000857.JPG","https://www.tenerifeon.es/images/Puntos_de_Inter%C3%A9s/P1000877.JPG","https://www.tenerifeon.es/images/Puntos_de_Inter%C3%A9s/P1000885.JPG"],"region":"Macizo de Anaga","permit":"","notice":""},{"name":"Teno Alto Self-Guided Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/teno-alto-self-guided-trail","distance_km":2.77,"rating":3,"difficulty":"Low","description":"On this route, discover the essence of Teno Alto: a place frozen in time, with a rural character that has been preserved for centuries. In order to differentiate it from the Massif and the Rural Park that take its name, this enclave is known as Teno Alto, although its inhabitants still refer to it as Teno. Pastures, bleating animals, handmade roof tiles, tree heath and reeds will tell the story of traditions and ways of living that enrich the legacy of our island.","photos":["https://www.tenerifeon.es/images/Senderos/Autoguiado_Teno_Alto/IMG_5981.jpg","https://www.tenerifeon.es/images/Senderos/Autoguiado_Teno_Alto/IMG_5984.jpg","https://www.tenerifeon.es/images/Senderos/Autoguiado_Teno_Alto/IMG_6054.jpg","https://www.tenerifeon.es/images/Senderos/Autoguiado_Teno_Alto/IMG_6056.jpg"],"region":"Macizo de Teno","permit":"","notice":""},{"name":"VM 5. Pista de El Rayo - Pista de El Fondo (2)","url":"https://www.tenerifeon.es/en/routes/motor-vehicles/5-pista-del-rayo-pista-de-fondo-2","distance_km":null,"rating":0,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Veh%C3%ADculos_a_Motor/VM_04_y_VM_05_Pista_del_Rayo/op-05_VM4y5Vista2.JPG","https://www.tenerifeon.es/images/Veh%C3%ADculos_a_Motor/VM_04_y_VM_05_Pista_del_Rayo/op-02-12-2015_VM-4_202.JPG","https://www.tenerifeon.es/images/Veh%C3%ADculos_a_Motor/VM_04_y_VM_05_Pista_del_Rayo/op-05_VM4y5Vista.JPG"],"region":"VM-5","permit":"required","notice":""}]</script>
<script>
const routes = JSON.parse(document.getElementById("routes").textContent);
const list = document.getElementById("list");
const sort = document.getElementById("sort");
const area = document.getElementById("area");
const count = document.getElementById("count");
const lightbox = document.getElementById("lightbox");
const lightboxImg = lightbox.querySelector("img");

function areaOf(route) {
  const region = (route.region || "").toLowerCase();
  const name = route.name.toLowerCase();
  const blob = region + " " + name;
  if (/chinyero|garachico/.test(blob)) return "Chinyero";
  if (/santiago del teide/.test(blob)) return "Teno";
  if (/teide|parque nacional|nationalpark/.test(region) || /^pnt |^gr 131|portillo/.test(name)) return "Teide";
  if (/\bteno\b|masca/.test(blob)) return "Teno";
  if (/anaga|taganana/.test(blob)) return "Anaga";
  if (/güímar|guimar|malpa[ií]s/.test(blob)) return "Güímar";
  if (/adeje|fañab|infierno/.test(blob)) return "Adeje";
  if (/arico|pr tf 86/.test(blob)) return "Arico";
  if (/fasnia|moralito/.test(blob)) return "Fasnia";
  if (/isora|chasna/.test(blob)) return "Guía de Isora";
  if (/realejo|rambla de castro/.test(blob)) return "Los Realejos";
  if (/agua garc|laguneta|pinolere|orotava|esperanza|aguamansa|matanza|rosario|nateros|candelaria|acentejo|fuente fr[ií]a|la caldera|pr tf 25|pr tf 35/.test(blob)) return "North";
  if (/masca|bolico|\bteno\b|el palmar|portelas|carrizales|monte del agua/.test(name)) return "Teno";
  if (/hiedras|enigmas|asomada|afur|benijo|chamorga|taganana|alm[aá]ciga|bailadero|las mercedes|chinamada|draguillo|sem[aá]foro|amogoje|pr tf 0|pr tf 10|pr tf 12/.test(name)) return "Anaga";
  if (/gu[ií]mar|monta[nñ]a grande|socorro|punta de los picos|camino de la virgen/.test(name)) return "Güímar";
  if (/samarines/.test(name)) return "Arico";
  if (/infierno/.test(name)) return "Adeje";
  if (/rambla de castro/.test(name)) return "Los Realejos";
  if (/guaria|pr tf 70/.test(name)) return "Guía de Isora";
  if (/pinolere|casa del agua|lagunetilla|erillas|lomo de la jara|chacorche|aguamansa/.test(name)) return "North";
  return "Other";
}

for (const route of routes) route.area = areaOf(route);

for (const name of [...new Set(routes.map((route) => route.area))].sort()) {
  const option = document.createElement("option");
  option.value = name;
  option.textContent = name;
  area.append(option);
}

function ratingLabel(value) {
  if (!value) return "No rating";
  return "★ " + String(value);
}

function highlightMap() {
  document.querySelectorAll(".spot").forEach((spot) => {
    spot.classList.toggle("on", spot.dataset.area === area.value);
  });
}

function render() {
  highlightMap();
  const ranked = routes
    .filter((route) => !area.value || route.area === area.value)
    .sort((a, b) => {
      return sort.value === "rating-asc" ? a.rating - b.rating : b.rating - a.rating;
    });
  list.replaceChildren();
  count.textContent = ranked.length + (ranked.length === 1 ? " route" : " routes");
  for (const route of ranked) {
    const card = document.createElement("article");
    const top = document.createElement("div");
    top.className = "top";
    const title = document.createElement("h2");
    title.textContent = route.name;
    const rating = document.createElement("div");
    rating.className = "rating";
    rating.textContent = ratingLabel(route.rating);
    top.append(title, rating);
    const meta = document.createElement("div");
    meta.className = "meta";
    const bits = [];
    if (route.distance_km != null) bits.push(route.distance_km + " km");
    if (route.difficulty) bits.push(route.difficulty);
    bits.push(route.area);
    meta.textContent = bits.join(" · ");
    card.append(top, meta);
    if (route.permit === "required" || route.notice) {
      const note = document.createElement("p");
      note.className = "note";
      const parts = [];
      if (route.permit === "required") parts.push("Permit required");
      if (route.notice) parts.push(route.notice);
      note.textContent = parts.join(" — ");
      card.append(note);
    }
    if (route.description) {
      const text = document.createElement("p");
      text.textContent = route.description;
      card.append(text);
    }
    if (route.photos.length) {
      const photos = document.createElement("div");
      photos.className = "photos";
      for (const src of route.photos) {
        const button = document.createElement("button");
        button.type = "button";
        const img = document.createElement("img");
        img.src = src;
        img.alt = route.name;
        img.loading = "lazy";
        button.append(img);
        button.addEventListener("click", () => {
          lightboxImg.src = src;
          lightboxImg.alt = route.name;
          lightbox.classList.add("open");
        });
        photos.append(button);
      }
      card.append(photos);
    }
    const link = document.createElement("a");
    link.className = "page";
    link.href = route.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Open on Tenerife On";
    card.append(link);
    list.append(card);
  }
}

sort.addEventListener("change", render);
area.addEventListener("change", render);
document.getElementById("island").addEventListener("click", (event) => {
  const spot = event.target.closest(".spot");
  area.value = spot && area.value !== spot.dataset.area ? spot.dataset.area : "";
  render();
});
document.getElementById("island").addEventListener("keydown", (event) => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const spot = event.target.closest(".spot");
  if (!spot) return;
  event.preventDefault();
  area.value = area.value === spot.dataset.area ? "" : spot.dataset.area;
  render();
});
lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") lightbox.classList.remove("open");
});
render();
</script>
</body>
</html>
