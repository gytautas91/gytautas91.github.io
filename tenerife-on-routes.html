e rest of the path continues down to the towns and villages in the valley to the south-west of the island.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_35_Boca_Chavao/Nuevas_de_Enrique/PNT_35_Boca_Chavao-1.jpg","https://www.tenerifeon.es/images/Senderos/PNT_35_Boca_Chavao/Nuevas_de_Enrique/PNT_35_Boca_Chavao-2.jpg"],"region":"PNT-35 Teide National Park","permit":"","notice":""},{"name":"PNT 36 Alto de La Fortaleza Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-36-alto-de-la-fortaleza","distance_km":2.19,"rating":0,"difficulty":"Low","description":"This trail sets off from La Degollada del Cedro, between La Fortaleza and El Cabezón, and runs across the plateau of Alto de La Fortaleza. If you walk this route in the evening you can catch a spectacular sunset as the sun sinks behind the island of La Palma, marking its silhouette on the horizon. You will also see the dense mass of Canary Island pine forest that stretches unbroken from the back of La Fortaleza to the foothills of the Teno Massif, along the Abeque ridge.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_36_Alto_de_la_Fortaleza/opt-Panorama_sin_ti%CC%81tulo1.jpg","https://www.tenerifeon.es/images/Senderos/PNT_36_Alto_de_la_Fortaleza/opt-Panorama_sin_ti%CC%81tulo2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_36_Alto_de_la_Fortaleza/opt-_NDR7026.jpg","https://www.tenerifeon.es/images/Senderos/PNT_36_Alto_de_la_Fortaleza/opt-_NDR7028.jpg","https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/Risco_La_Fortaleza_2.jpg"],"region":"PNT-36 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 36.1 Ramal Alto de La Fortaleza","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-36-1-ramal-alto-de-la-fortaleza","distance_km":null,"rating":0,"difficulty":"Low","description":"Short spur trail that will take you from the PNT 36 trail (Alto de la Fortaleza) to the La Abejera viewpoint and Pico Cabras.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_36.1_Ramal_Alto_de_la_Fortaleza/opt-P1010084.jpg","https://www.tenerifeon.es/images/Senderos/PNT_36.1_Ramal_Alto_de_la_Fortaleza/opt-P1010089.jpg","https://www.tenerifeon.es/images/Senderos/PNT_36.1_Ramal_Alto_de_la_Fortaleza/opt-P1010096.jpg","https://www.tenerifeon.es/images/Senderos/PNT_36.1_Ramal_Alto_de_la_Fortaleza/opt-P1010098.jpg","https://www.tenerifeon.es/images/Senderos/PNT_01_La_Fortaleza/Risco_La_Fortaleza_2.jpg"],"region":"PNT-36.1 Teide National Park","permit":"","notice":""},{"name":"PNT 37 Cerrillar - Carnicería","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-37-cerrillar-carniceria","distance_km":3.02,"rating":4,"difficulty":"Low","description":"This trail offers breathtaking views of the Orotava Valley, when it is not covered by a sea of clouds, as you walk among the volcanoes of the Caramujo sector. It heads north-east from trail PNT 02 (Arenas Negras), near Montaña del Cerrillar, and runs along the slopes of Montaña de la Punta de Maja until it crosses trail PNT 08 (El Filo) near its start.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_37_Cerrillar_Carniceri%CC%81a/opt-Sendero_Cerrillar_Carniceri%CC%81a.jpg","https://www.tenerifeon.es/images/Senderos/PNT_37_Cerrillar_Carniceri%CC%81a/opt-Sendero_Cerrillar_Carniceri%CC%81a_2.jpg","https://www.tenerifeon.es/images/Senderos/PNT_37_Cerrillar_Carniceri%CC%81a/opt-Sendero_Cerrillar_Carniceri%CC%81a_3.jpg","https://www.tenerifeon.es/images/Senderos/PNT_37_Cerrillar_Carniceri%CC%81a/opt-Sendero_Cerrillar_Carniceri%CC%81a_4.jpg","https://www.tenerifeon.es/images/Senderos/PNT_37_Cerrillar_Carniceri%CC%81a/opt-Sendero_Cerrillar_Carniceri%CC%81a_5.jpg","https://www.tenerifeon.es/images/Senderos/PNT_37_Cerrillar_Carniceri%CC%81a/opt-Sendero_Cerrillar_Carniceri%CC%81a_6.jpg"],"region":"PNT-37 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 38 Cuevas Negras","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-38-cuevas-negras","distance_km":2.14,"rating":3.5,"difficulty":"Medium","description":"This trail connects the lower section of trail PNT 09 (Teide - Pico Viejo - Narices del Teide Viewpoint) with PNT 13 (Sámara) at its highest point. The path takes you through the area known as Llanos de Chahorra, between the volcanic cones of Montaña Cruz de Tea, Montaña Reventada and Lomo de Chío on the slopes of Pico Viejo.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_38_Cuevas_Negras/opt-Cuevas_Negras_sendero.jpg","https://www.tenerifeon.es/images/Senderos/PNT_38_Cuevas_Negras/opt-Cuevas_Negras_sen%CC%83al_sendero_38.jpg","https://www.tenerifeon.es/images/Senderos/PNT_38_Cuevas_Negras/opt-Cuevas_Negras.jpg"],"region":"PNT-38 Teide National Park","permit":"","notice":""},{"name":"PNT 39 Teleférico - Montaña Blanca - Minas de San José","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-39-teleferico-montana-blanca-minas-de-san-jose","distance_km":null,"rating":3,"difficulty":"Medium","description":"This is the perfect route from the Teide Cable Car to Montaña Blanca, avoiding the danger of walking along the road. The trail takes you from Montaña Majúa, in front of the cable car station, to the Minas de San José; you will also walk past the base of the dome of Montaña Blanca with its spectacular lava fields.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_39_Telefe%CC%81rico_Montan%CC%83a_Blanca_Minas_de_San_Jose%CC%81/opt-Sendero_39_tramo_Montan%CC%83a_Blanca_telefe%CC%81rico.jpg","https://www.tenerifeon.es/images/Senderos/PNT_39_Telefe%CC%81rico_Montan%CC%83a_Blanca_Minas_de_San_Jose%CC%81/opt-Sendero_39.jpg"],"region":"PNT-39 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 40 Llano de Ucanca - Boca Tauce","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-40-llano-de-ucanca-boca-tauce","distance_km":4.83,"rating":3,"difficulty":"Low","description":"This easy trail leads you across the plains between giants, passing through the lava fields at the western edge of the Las Cañadas caldera.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_40_Llano_de_Ucanca_Boca_Tauce/opt-_NDR7451.jpg","https://www.tenerifeon.es/images/Senderos/PNT_40_Llano_de_Ucanca_Boca_Tauce/opt-_NDR7439.jpg","https://www.tenerifeon.es/images/Senderos/PNT_40_Llano_de_Ucanca_Boca_Tauce/opt-_NDR7326.jpg","https://www.tenerifeon.es/images/Senderos/PNT_40_Llano_de_Ucanca_Boca_Tauce/opt-_NDR7287.jpg","https://www.tenerifeon.es/images/Senderos/PNT_40_Llano_de_Ucanca_Boca_Tauce/opt-_NDR5921.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/219_Zapatilla_de_la_reina.jpeg"],"region":"PNT-40 Parque Nacional del Teide","permit":"","notice":""},{"name":"PNT 41 Barranco de Erques","url":"https://www.tenerifeon.es/en/routes/hiking/pnt-41-barranco-de-erques","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"This short trail heads down from the head of the Erques ravine towards the south-west of the island. As this is a fairly steep trail, we recommend you avoid it during the rainy season.","photos":["https://www.tenerifeon.es/images/Senderos/PNT_41_Barranco_de_Erques/Barranco-de-Erques.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/088_Museo_Juan_%C3%89vora.jpeg"],"region":"PNT-41 Teide National Park","permit":"","notice":""},{"name":"PR TF 01 Las Mercedes - Cruz del Carmen","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-01-las-mercedes-cruz-del-carmen","distance_km":2.5,"rating":3,"difficulty":"Medium","description":"This trail runs from the centre of Las Mercedes to the Llanos de los Loros viewpoint, with exceptional views of the Anaga Massif. It starts in the picturesque square next to the church in Las Mercedes and runs parallel to the main road (TF-12) until it crosses the ravine. The trail then crosses the road and enters the monteverde woodland that is typical of our island and heads towards Llano de los Viejos, where you will find the recreational area of the same name.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_1_Las_Mercedes_-_Cruz_del_Carmen/deporte_senderismo_anaga_1A7382_alta.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_1_Las_Mercedes_-_Cruz_del_Carmen/TimePhoto_20210819_082000_2.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_1_Las_Mercedes_-_Cruz_del_Carmen/TimePhoto_20210819_083134_2.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_1_Las_Mercedes_-_Cruz_del_Carmen/TimePhoto_20210819_112009_2.jpg"],"region":"PR-TF 01 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 02.1. PR TF 02 - PR TF 09 Spur trail (by El Frontón)","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-02-1-el-fronton-spur-trail","distance_km":null,"rating":0,"difficulty":"Medium","description":"A less transited branch off the PR TF 2 route that runs along a reddish track surrounded by lush laurel forest. The path starts at La Gollada de los Chiqueros and heads towards the old Camino de Taborno up steep, zigzagging steps. You will soon come to a striking corridor of ferns before reaching the high point of this route: a panoramic viewpoint with impressive views of the Afur ravine.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_02.1_Derivacion_El_Fronton/El_Fronton_Portada.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_02.1_Derivacion_El_Fronton/El_Fronton.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_02.1_Derivacion_El_Fronton/El_Fronton_5.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_02.1_Derivacion_El_Fronton/El_Fronton_8.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_02.1_Derivacion_El_Fronton/El_Fronton_9_light.jpg"],"region":"PR-TF 02.1 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 03 Casas de La Cumbre - Valle Brosque - Casa Forestal","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-03-casas-de-la-cumbre-valle-brosque-casa-forestal","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"This is a very challenging trail that takes you into the dramatic valleys on the southern slopes of the Anaga Massif. This trail starts at the Forestry Service (Unidad de Montes) of the Santa Cruz de Tenerife City Council, near the Nuestra Señora de Guadalupe chapel, in Casas de la Cumbre, and follows the path that heads left from the road.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_03_Casas_de_la_Cumbre_Valle_Brosque/8dea5df9-e6a9-4e2c-8636-806dc44af76a.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_03_Casas_de_la_Cumbre_Valle_Brosque/026fad35-1da7-4513-ac4d-c77b311b397b.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_03_Casas_de_la_Cumbre_Valle_Brosque/6ad34e17-a80b-4835-aa5f-6124a1e5d0e3.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_03_Casas_de_la_Cumbre_Valle_Brosque/8b164cdd-5b19-4799-938a-24f0e83739a5.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_03_Casas_de_la_Cumbre_Valle_Brosque/74dc7e02-eefc-4788-90e2-5f7031a6af6f.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_03_Casas_de_la_Cumbre_Valle_Brosque/819da88a-649a-4022-a930-529084504eb9.jpg"],"region":"PR-TF 03 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 04 El Bailadero - Taganana","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-04-el-bailadero-taganana","distance_km":3.05,"rating":2.5,"difficulty":"Medium","description":"The trail begins in El Bailadero, and descends towards the great rocky outcrop of Roque del Valle, which it skirts and then crosses the TF-134 road, in the vicinity of Roque de Amogoje. At this point you will be rewarded with beautiful views of the village of Taganana and the hamlet of El Campanario. Keep going and cross the road another two times until you reach the Azanos neighbourhood.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_04_El_Bailadero_Taganana/Bailadero_3.jpg"],"region":"PR-TF 04 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 04.1 Amogoje - Almáciga","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-04-1-playa-del-roque-de-las-bodegas-spur-trail","distance_km":2.67,"rating":3.5,"difficulty":"Medium","description":"Variant of the PR TF 04 (El Bailadero - Taganana) route that starts next to Roque de Amogoje. The trail starts on the right side of the road, with a steep descent towards the slopes of the El Campanario area. After you reach the hamlet of Roque Placeres, you will continue along a much gentler slope to the hamlet of Almáciga, overlooking the striking beach that gives it its name.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_04.1_Derivacion_Roque_de_las_Bodegas/178e95bd-bd2a-4308-b433-59d758b3b84c.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_04.1_Derivacion_Roque_de_las_Bodegas/10-19-2017_13-01-04.photo.120437.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_04.1_Derivacion_Roque_de_las_Bodegas/b8b508de-3aa2-4a21-a20b-eef0c3bf6eb8.jpg"],"region":"PR-TF 04.1 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 05 Chamorga - Igueste de San Andrés","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-05-igueste-de-san-andres-chamorga","distance_km":null,"rating":3,"difficulty":"Medium","description":"This route in the Anaga mountains leads you through hamlets and laurel forests from the summit to Tenerife’s coast. It starts in Chamorga, the easternmost village on the island. From here the trail climbs through the laurel forest to the hamlets of La Cumbrilla and El Lomo de Las Bodegas. It then follows the ancient path that once linked the north-eastern part of the Anaga Massif with Igueste de San Andrés, passing through La Atalaya and the hamlet of Las Casillas.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_5_Igueste_de_San_Andr%C3%A9s_Chamorga/op-Panoram-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_5_Igueste_de_San_Andr%C3%A9s_Chamorga/op-_NDR5245-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_5_Igueste_de_San_Andr%C3%A9s_Chamorga/op-_NDR5267-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_5_Igueste_de_San_Andr%C3%A9s_Chamorga/op-_NDR5465-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_5_Igueste_de_San_Andr%C3%A9s_Chamorga/op-_NDR5484-compressed.jpg"],"region":"PR-TF 05 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 05.1 Igueste de San Andrés - El Semáforo","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-05-1-el-semaforo-spur-trail","distance_km":2.12,"rating":2.5,"difficulty":"High","description":"A steep uphill route that links Igueste de San Andrés with the curious electric semaphore tower (El Semáforo). This trail begins next to Las Casas de Abajo, at the end of the Igueste de San Andrés main road. Much of the route is carved into the rock and offers excellent views of the village of Igueste de San Andrés and the coast. If you look carefully, you can even see the docks of Santa Cruz de Tenerife in the distance from a few points along the way.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_5.1_Derivacio%CC%81n_al_Sema%CC%81foro/opt-_NDR0335-compressed.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_5.1_Derivacio%CC%81n_al_Sema%CC%81foro/opt-Panorama_sin_ti%CC%81tulo1-compressed.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_5.1_Derivacio%CC%81n_al_Sema%CC%81foro/opt-_NDR0393.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_5.1_Derivacio%CC%81n_al_Sema%CC%81foro/opt-_NDR0415-compressed.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_5.1_Derivacio%CC%81n_al_Sema%CC%81foro/opt-_NDR0418-compressed.jpeg"],"region":"PR-TF 05.1 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 06 El Draguillo - Chamorga - Faro de Anaga","url":"https://www.tenerifeon.es/en/routes/hiking/chamorga-las-palmas-el-draguillo-2","distance_km":null,"rating":3.5,"difficulty":"High","description":"This is a trail with steep gradients that connects El Draguillo with the Faro de Anaga lighthouse, passing through the village of Chamorga.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_6.1_Variante_de_Tafada/op-IMG_2908-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_06_Draguillo_Faro_Anaga/IMG_2886.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_06_Draguillo_Faro_Anaga/IMG_2866.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_06_Draguillo_Faro_Anaga/IMG_2838.jpg"],"region":"PR-TF 06 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 06.1 Chamorga - Casas de Tafada - Faro de Anaga","url":"https://www.tenerifeon.es/en/routes/hiking/tf-06-1-tafada-variant","distance_km":2.78,"rating":3.5,"difficulty":"Medium","description":"This is the only trail on the island that takes you to the photogenic Faro de Anaga lighthouse and its spectacular views of Roque Bermejo. The route starts from Chamorga, the most easterly village in the Anaga mountains. It ascends to El Pilón, crosses Paso de la Burra and climbs stone steps up to the ruins of Caserío de Tafada. From this point the descent to the Anaga Lighthouse begins, with incredible views of the Roques de Anaga and the entire east coast of the massif.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_6.1_Variante_de_Tafada/op-IMG_2846.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_6.1_Variante_de_Tafada/op-IMG_2844.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_6.1_Variante_de_Tafada/op-IMG_2882-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_6.1_Variante_de_Tafada/op-IMG_2908-compressed.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_6.1_Variante_de_Tafada/op-TimePhoto_20211013_134651_2-compressed.jpg"],"region":"PR-TF 06.1 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 06.2 Roque de Las Bodegas - Almáciga - Benijo - El Draguillo","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-06-2-roque-de-las-bodegas-beach-el-draguillo","distance_km":4.44,"rating":3.5,"difficulty":"Low","description":"Decreto de la Concejalía de Gobierno del Área de Seguridad, Movilidad y Accesibilidad Universal con competencias sectoriales en materia de Seguridad y Emergencias, Igualdad, Diversidad afectivo sexual e Infraestructuras rurales de Anaga del Excmo. Ayuntamiento de Santa Cruz de Tenerife. Asunto: expediente 518/202, por el que se procede al cierre, de forma cautelar y por razones de seguridad, del acceso a la “Playa de Benijo”.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_06.2_Roque_de_las_Bodegas_El_Draguillo/10-20-2017_11-27-56.photo.071610.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_06.2_Roque_de_las_Bodegas_El_Draguillo/11-17-2017_12-31-09.photo.070724.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_06.2_Roque_de_las_Bodegas_El_Draguillo/d725399a-6250-4dd2-a29f-4c8543c05f24.jpg"],"region":"PR-TF 06.2 Taganana","permit":"","notice":"Caution: incident due to rockfalls."},{"name":"PR TF 06.3 Benijo - Cruz del Draguillo","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-06-3-camino-del-paso-del-hediondo","distance_km":2.19,"rating":3.5,"difficulty":"Medium","description":"This route runs along the Camino del Hediondo, which owes its name to a curious “hediondo” (fetid, but not excessively so) flowering plant that attracts pollinating insects at certain times of the year. It climbs from Benijo to the Piedra del Draguillo, with spectacular views of the whole valley. Along the way you will also see the hamlets of Almáciga, Benijo and El Draguillo, as well as the spectacular rock formations on the north coast of the Anaga Massif.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_06.3_Camino_Paso_del_Hediondo/358edb2f-439f-4173-ae4b-e7595199bf8e.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_06.3_Camino_Paso_del_Hediondo/145954d5-2cc2-4606-996c-c5ca5f7599b3.jpg"],"region":"PR-TF 06.3 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 09 Afur - Las Carboneras","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-09-las-carboneras-afur","distance_km":null,"rating":4,"difficulty":"Medium","description":"The route sets off from the square in Afur and leads into the ravine that takes you to Taborno. Then take the Lomo Centeno path. You will come across a small chapel next to the path, with a wooden cross. A little further on you will see some steps that lead to the side of the ravine where you will be able to descend and cross it. Soon after, you will begin to enjoy the spectacular view of the hamlet of Las Carboneras on a ridge below Roque de Tenejías and Roque de Feles.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_09_Las_Carboneras_Afur/Carboneras_02.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_09_Las_Carboneras_Afur/Carboneras_01.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_09_Las_Carboneras_Afur/Carboneras_03.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_09_Las_Carboneras_Afur/Carboneras_04.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_09_Las_Carboneras_Afur/Carboneras_05.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_09_Las_Carboneras_Afur/Carboneras_06.jpg"],"region":"PR-TF 09 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 10 Cruz del Carmen - Punta del Hidalgo","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-10-cruz-del-carmen-punta-del-hidalgo","distance_km":null,"rating":3,"difficulty":"Medium","description":"This trail runs from the summit to the coast and descends through all the layers of vegetation in the Anaga Rural Park. It starts at the Cruz del Carmen Visitor Centre and leads northwards through the laurel forest to Chinamada. Once there, you will be able to admire the famous cave houses of the area. From this point, the route continues towards Punta del Hidalgo along a path carved in the rock with magnificent views of the north coast of the Anaga Massif.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_10_Cruz_del_Carmen_Punta_del_Hidalgo/opt-_NDR0863.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10_Cruz_del_Carmen_Punta_del_Hidalgo/opt-04_PRTF10Vistas.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10_Cruz_del_Carmen_Punta_del_Hidalgo/opt-_IGP5932-.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_10_Cruz_del_Carmen_Punta_del_Hidalgo/opt-_NDR0751.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10_Cruz_del_Carmen_Punta_del_Hidalgo/opt-_NDR5190_1.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10.1_Las_Carboneras_Chinamada/opt-_NDR5250.jpg"],"region":"PR-TF 10 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 10.1 Degollada Las Escaleras - Las Carboneras - Chinamada","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-10-1-las-carboneras-chinamada","distance_km":3.14,"rating":3.5,"difficulty":"Medium","description":"This route starts in the area known as Las Escaleras and offers fantastic views of Roque de Taborno as you begin. The path continues to the right, taking you directly to Las Carboneras. From there, follow the road and then climb some steps that will take you parallel to the road around the base of Roque de Tenejía. Follow the road again until you reach the picturesque village of Chinamada with its cave houses.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_10.1_Las_Carboneras_Chinamada/opt-_NDR5260.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10.1_Las_Carboneras_Chinamada/opt-Panorama_sin_ti%CC%81tulo1258.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10.1_Las_Carboneras_Chinamada/opt-_NDR5190.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10.1_Las_Carboneras_Chinamada/opt-_NDR5250.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_10.1_Las_Carboneras_Chinamada/opt-_NDR5325-.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_10.1_Las_Carboneras_Chinamada/opt-_NDR5353-.jpeg"],"region":"PR-TF 10.1 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 12.1 Tegueste Spur trail (from PR TF 12)","url":"https://www.tenerifeon.es/en/routes/hiking/tegueste-variant","distance_km":null,"rating":0,"difficulty":"Medium","description":"This route starts near El Ajuntadero and then takes the track on the left, known as Los Dornajos. You will enter a shaded and gentle path that leads across the forested hills of Tegueste. Follow it until you reach Mesa de La Orilla, where you can enjoy beautiful views of the valley.From here the route continues down the hillside until you reach the town centre of Tegueste via the Puente de Palo bridge.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_12.1_Variante_de_Tegueste/77257ce5-ee92-4327-be7a-08d4e6d8fd5e.jpg"],"region":"PR-TF 12.1 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 12.2 Pedro Álvarez Spur trail (from PR TF 12)","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-12-2-pedro-alvarez","distance_km":3.48,"rating":0,"difficulty":"Medium","description":"This route, which connects with the PR TF 12 trail (Cruz del Carmen - Bajamar), starts at the beginning of the El Moquinal path, near Cuadras de Don Benito. The path enters a leafy forest until it reaches the road that leads to the La Quebrada Recreational Area. The path does not reach this recreational area, however, but runs along a firebreak heading towards La Orilla. The route then turns left along a gentle path that leads to Pedro Álvarez via Hoya de Nieto.","photos":["https://www.tenerifeon.es/images/Senderos/PR-TF_12.2_Pedro_%C3%81lvarez/Anaga_-_MDT_-_Cruz_del_Carmen_Batan_-_009-compressed.jpg"],"region":"PR-TF 12.2 Macizo de Anaga","permit":"","notice":""},{"name":"PR TF 25.1 Las Raíces Recreational Area Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-25-1-las-raices-loop-trail","distance_km":null,"rating":3,"difficulty":"Medium","description":"This loop trail starts at the Las Raíces Recreational Area and heads towards Montaña Chica, entering a dense pine forest. As the pine forest begins to thin, you will enjoy magnificent panoramic views of the Güimar Valley, with Montaña del Socorro, also known as Montaña Grande, dominating the vistas.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_25.1_Circular_La_Rai%CC%81ces/Nuevas/Circular_portada.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.1_Circular_La_Rai%CC%81ces/Nuevas/Circular_1.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.1_Circular_La_Rai%CC%81ces/opt-20150502_0909.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.1_Circular_La_Rai%CC%81ces/opt-20150502_0968.jpg"],"region":"PR-TF 25.1 Monte de La Esperanza","permit":"","notice":""},{"name":"PR TF 25.2 Las Lagunetas - Hoya del Abade Recreational Area","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-25-2-las-lagunetas-hoya-del-abade","distance_km":null,"rating":0,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_25.2_Las_Lagunetas_Hoya_de_Abade/20150501_0590.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.2_Las_Lagunetas_Hoya_de_Abade/20150501_0595.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.2_Las_Lagunetas_Hoya_de_Abade/20150501_0721.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.2_Las_Lagunetas_Hoya_de_Abade/20150503_1536.jpg"],"region":"PR-TF 25.2 Las Lagunetas","permit":"","notice":""},{"name":"PR TF 25.3 Las Lagunetas - Los Nateros","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-25-3-las-lagunetas-los-nateros","distance_km":null,"rating":0,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_25_Las_Rai%CC%81ces_Lomo_La_Jara/WhatsApp_Image_2023-10-10_at_12.00.31_002.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.3_Las_Lagunetas_Los_Nateros/opt-20150507_3175.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.3_Las_Lagunetas_Los_Nateros/opt-20150507_3247.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.3_Las_Lagunetas_Los_Nateros/opt-20150507_3248.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.3_Las_Lagunetas_Los_Nateros/opt-20150507_3260.jpg"],"region":"PR-TF 25.3 Las Lagunetas","permit":"","notice":""},{"name":"PR TF 25.4 Lomo de La Jara Recreational Area loop trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-25-4-lomo-la-jara-loop-trail","distance_km":2.57,"rating":3.5,"difficulty":"Low","description":"A short, easy loop trail through the Agua García forest, one of the island’s best-loved nature spots. The route starts at the Lomo la Jara recreational area, crossing the wooden fence on the other side of the track. Descend slightly down the path and then take the exit to the left at the first fork. Continue until you come to the Agua García accessible trail and continue walking on its wooden walkways until you reach the Heritage Information Centre.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_25.4_Circular_Lomo_La_Jara/20150504_115231.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.4_Circular_Lomo_La_Jara/20150504_2460.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.4_Circular_Lomo_La_Jara/20150504_105645.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.4_Circular_Lomo_La_Jara/20150504_114753.jpg"],"region":"PR-TF 25.4 Monte de Agua García","permit":"","notice":""},{"name":"PR TF 25.5. GR 131 (Anaga – Chasna) - PR TF 25 (Las Raíces Recreational Area – Lomo La Jara Recreational Area) Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/enlace-pr-tf25-con-el-gr-132","distance_km":null,"rating":5,"difficulty":"Very low","description":"Short trail within the Las Lagunetas Protected Landscape that connects the PR TF 25 Las Raíces Recreational Area – Lomo La Jara Recreational Area and GR 131 Anaga – Chasna trails.","photos":["https://www.tenerifeon.es/images/Espacios_Naturales/T-29_PP_LAS_LAGUNETAS/op-Seta-compressed.jpg","https://www.tenerifeon.es/images/Espacios_Naturales/T-29_PP_LAS_LAGUNETAS/op-P-compressed.jpg"],"region":"PR-TF 25.5 La Esperanza","permit":"","notice":""},{"name":"PR TF 25.6. PR TF 25.2 - PR TF 25.3 Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/trail-connecting-pr-tf-25-2-with-pr-tf-25-3","distance_km":null,"rating":0,"difficulty":"Low","description":"A short 700 m trail that runs along the first section of route 2 of the Camino de Candelaria, a pilgrimage route to the Basilica of Candelaria. This is a slightly descending track through dense Canary Island pine forest that joins the PR TF 25.2 (Las Lagunetas - Hoya de Abade) with the PR TF 25.3 (Las Lagunetas - Los Nateros).","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_25.7_Enlace_PR_TF_25.2_con_PR_TF_25.3/PR_TF_25.7_ok.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_25.7_Enlace_PR_TF_25.2_con_PR_TF_25.3/PR_TF_25.7_ok_2.jpg"],"region":"PR-TF 25.6 Las Lagunetas","permit":"","notice":""},{"name":"PR TF 25.7. PR TF 25 - Fuente Fría Rest Area Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-25-7-trail-connecting-pr-tf-25-with-fuente-fria-rest-area","distance_km":null,"rating":4,"difficulty":"Very low","description":"This small branch trail, barely 200 metres long, takes you to the Fuente Fría Rest Area from the PR TF 25 trail, which in turn connects the Las Raíces Recreational Area with the Lomo La Jara Recreational Area. The route takes you through the leafy mixed forest of Canary Island pine and fayal-brezal (Morella-Erica heath) that is typical of north-west Tenerife.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_25.7/25.7_Fuente_Fria.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_25.7/25.7_camino.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_25.7/25.7_tronco.JPG"],"region":"PR-TF 25.7","permit":"","notice":""},{"name":"PR TF 35 La Caldera Recreational Area - Mamio - La Caldera Recreational Area Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-35-la-caldera-mamio-la-caldera","distance_km":null,"rating":2.5,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_35_La_Caldera_Mamio/opt-_NDR0715.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35_La_Caldera_Mamio/opt-_NDR0659.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35_La_Caldera_Mamio/opt-_NDR0639.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35_La_Caldera_Mamio/opt-_NDR0575.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35_La_Caldera_Mamio/opt-PR_-_TF_35_Mamio_-_Pinolere_-_La_Caldera_03.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35_La_Caldera_Mamio/opt-GR131_PR35_SL81_639.jpg"],"region":"PR-TF 35 La Caldera","permit":"","notice":""},{"name":"PR TF 35.1 Casa del Agua - Pinolere","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-35-1-casa-del-agua-pinolere","distance_km":4.22,"rating":2,"difficulty":"","description":"This extension connects the PR TF 35 loop trail with Pinolere as it descends through the Orotava Valley towards the coast.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_35.1_Casa_del_Agua_Pinolere/opt-_ndr0363.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.1_Casa_del_Agua_Pinolere/opt-sen%CC%83alverticalpr_mamio.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.1_Casa_del_Agua_Pinolere/opt-pr_tf_35.1_pinolere_por_el_camino_de_candelaria_04.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.1_Casa_del_Agua_Pinolere/opt-pr_tf_35.1_pinolere_por_el_camino_de_candelaria_03.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.1_Casa_del_Agua_Pinolere/opt-pr_tf_35.1_pinolere_por_el_camino_de_candelaria_02.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.1_Casa_del_Agua_Pinolere/opt-pr_tf_35.1_pinolere_por_el_camino_de_candelaria_01.jpg"],"region":"PR-TF 35.1 Pinolere","permit":"","notice":""},{"name":"PR TF 35.3 Llano de Los Corrales - Pinolere","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-35-3-llano-de-los-corrales-pinolere","distance_km":2.74,"rating":0,"difficulty":"","description":"Variant of the PR TF 35.1 trail that connects the Mamio forest track with the village of Pinolere by a more westerly alternative route.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_35.3_Llano_de_los_Corrales_Pinolere/opt-_ndr0248.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.3_Llano_de_los_Corrales_Pinolere/opt-04_prtf35.3pajar.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.3_Llano_de_los_Corrales_Pinolere/opt-panorama_sin_ti%CC%81tulo3.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.3_Llano_de_los_Corrales_Pinolere/opt-pr_-_tf_35.3_pinolere_-_rosa_pen%CC%83a_02.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.3_Llano_de_los_Corrales_Pinolere/opt-pr_-_tf_35.3_pinolere_-_rosa_pen%CC%83a_04.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_35.3_Llano_de_los_Corrales_Pinolere/opt-_ndr0374.jpg"],"region":"PR-TF 35.3 Pinolere","permit":"","notice":""},{"name":"PR TF 35.4 Camino a Candelaria (Aguamansa - Crucita)","url":"https://www.tenerifeon.es/en/routes/hiking/cc-02-1-camino-a-candelaria-aguamansa-crucita","distance_km":4.52,"rating":2,"difficulty":"Medium","description":"The Camino a Candelaria is an old pilgrims’ trail linking the towns of Aguamansa and Candelaria. This route offers magnificent views over the Orotava Valley as you pass through immense pine forests and volcanic landscapes on your way up to the Cumbre Dorsal, the backbone of the island. The trail starts in Aguamansa at an altitude of 1000m.","photos":["https://www.tenerifeon.es/images/Senderos/CC_02.1_Camino_Candelaria_Aguamansa_La_Crucita/opt-Panora%CC%81mica_Mirador_de_La_Crucita_002.jpg","https://www.tenerifeon.es/images/Senderos/CC_02.1_Camino_Candelaria_Aguamansa_La_Crucita/opt-La_Crucita_01.jpg","https://www.tenerifeon.es/images/Senderos/CC_02.1_Camino_Candelaria_Aguamansa_La_Crucita/opt-1_F_2.jpg"],"region":"PR-TF 35.4 Altos de La Orotava","permit":"","notice":""},{"name":"PR TF 40.1 Camino Punta del Risco","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-40-1-camino-punta-del-risco","distance_km":null,"rating":4,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_40.1_Camino_Punta_del_Risco/opt-panorama_sin_ti%CC%81tulo8.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_40.1_Camino_Punta_del_Risco/opt-panorama_sin_ti%CC%81tulo9.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_40.1_Camino_Punta_del_Risco/opt-_ndr7959.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_40.1_Camino_Punta_del_Risco/opt-_ndr7963.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_40.1_Camino_Punta_del_Risco/opt-_ndr7990.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_40.1_Camino_Punta_del_Risco/opt-_ndr7998.jpg"],"region":"PR-TF 40.1 El Realejo Alto","permit":"","notice":""},{"name":"PR TF 41.1 Route 040 - El Portillo Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-41-1-route-040-el-portillo-spur-trail","distance_km":3.05,"rating":0,"difficulty":"Medium","description":"This is a branch of the PR TF 41 (Route 0-4-0) trail that links El Cabezón mountain with El Portillo del Teide along a pleasant walk with views. It runs along the Teide National Park trail PNT 01 (La Fortaleza) for most of the way, ending at El Portillo Alto.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_41.1_Ramal_al_Portillo_Alto/Ramal_Portillo_Nuevas/IMG_4633.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_41.1_Ramal_al_Portillo_Alto/Ramal_Portillo_Nuevas/IMG_4623.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_41.1_Ramal_al_Portillo_Alto/Ramal_Portillo_Nuevas/IMG_4630.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_41.1_Ramal_al_Portillo_Alto/Ramal_Portillo_Nuevas/_NDR1672.jpg"],"region":"PR-TF 41.1 Parque Nacional del Teide","permit":"","notice":""},{"name":"PR TF 43.1 San José de Los Llanos- Montaña Chinyero","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-43-1-san-jose-de-los-llanos-montana-chinyero","distance_km":4.47,"rating":4.5,"difficulty":"Low","description":"This is a branch of the PR TF 43 trail (Garachico - Chinyero - Garachico) that leaves from the square in San José de los Llanos (El Tanque) and heads through pine forests towards the Chinyero volcano. The trail passes Montaña de La Quebrada, where there is a calvary, and continues on, leaving Montaña del Banco on your right.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_43.1_San_Jose%CC%81_de_los_Llanos_Montan%CC%83a_Chinyero/opt-panorama_sin_ti%CC%81tulo6.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.1_San_Jose%CC%81_de_los_Llanos_Montan%CC%83a_Chinyero/opt-04_prtf43.1panoramica.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.1_San_Jose%CC%81_de_los_Llanos_Montan%CC%83a_Chinyero/opt-04_prtf43.1panoramica2.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.1_San_Jose%CC%81_de_los_Llanos_Montan%CC%83a_Chinyero/opt-04_prtf43.1sendero.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.1_San_Jose%CC%81_de_los_Llanos_Montan%CC%83a_Chinyero/opt-panorama_sin_ti%CC%81tulo9.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.1_San_Jose%CC%81_de_los_Llanos_Montan%CC%83a_Chinyero/opt-panorama_sin_ti%CC%81tulo12.jpg"],"region":"PR-TF 43.1 Altos de Garachico","permit":"","notice":""},{"name":"PR TF 43.2 Los Partidos de Franquis - Montaña Chinyero","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-43-2-los-partidos-chinyero","distance_km":4.85,"rating":3,"difficulty":"Low","description":"This beautiful path through pine forests and volcanic terrain begins at Los Partidos de Franchis, next to the roundabout where the bus drops you off. From this point, join the Pino Loro track to enter a landscape of contrasts between black volcanic lava flows and the vibrant green of the pine forest. This section of the trail is shared with the PR TF 51 San José de los Llanos –Punta de Teno.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_43.2_Los_Partidos_-_Chinyero/opt-_ndr4451.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.2_Los_Partidos_-_Chinyero/opt-_ndr4369.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.2_Los_Partidos_-_Chinyero/opt-_ndr4323.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.2_Los_Partidos_-_Chinyero/opt-_ndr4301.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.2_Los_Partidos_-_Chinyero/opt-panorama_sin_ti%CC%81tulo15.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.2_Los_Partidos_-_Chinyero/opt-04_prtf43.2panoramica2.jpg"],"region":"PR-TF 43.2 Chinyero","permit":"","notice":""},{"name":"PR TF 43.3 Santiago del Teide - Montaña Chinyero","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-43-3-santiago-del-teide-montana-chinyero","distance_km":null,"rating":4,"difficulty":"Medium","description":"This trail is a branch of the PR TF 43 (Garachico - Chinyero - Garachico) that starts from the Santiago del Teide town square. It leaves the road at the intersectio with Calle Juan Cabeza to begin the ascent along old footpaths in the direction of El Calvario, until it reaches Montaña de Bilma. Continue along a slightly steeper climb until you cross the Canal de Vergara track to reach the north face of Montaña de Los Poleos.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_43.3_Santiago_del_Teide_Montan%CC%83a_Chinyero/opt-04_PRTF43.3Sendero.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.3_Santiago_del_Teide_Montan%CC%83a_Chinyero/opt-Panorama_sin_ti%CC%81tulo1_.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.3_Santiago_del_Teide_Montan%CC%83a_Chinyero/opt-Panorama_sin_ti%CC%81tulo1_1.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.3_Santiago_del_Teide_Montan%CC%83a_Chinyero/opt-_NDR9339.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.3_Santiago_del_Teide_Montan%CC%83a_Chinyero/opt-_NDR9474.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.3_Santiago_del_Teide_Montan%CC%83a_Chinyero/opt-_NDR9519.jpg"],"region":"PR-TF 43.3 Chinyero","permit":"","notice":""},{"name":"PR TF 43.4 La Montañeta to PR TF 43 Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-43-4-derivacion-a-la-montaneta","distance_km":null,"rating":0,"difficulty":"Low","description":"A short trail that branches off from the PR TF 43 (Garachico - Chinyero - Chinyero) that will allow you to visit the village of La Montañeta, within the municipality of Garachico. The San Francisco de Asís chapel in La Montañeta is a highlight, next to a small recreational park.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_43.4_Derivacion_La_Montaneta/11-08-2016_11-08-14.photo.112551.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.4_Derivacion_La_Montaneta/5656c8f1-649d-4a07-95a4-757fb8906ae5.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.4_Derivacion_La_Montaneta/78677e10-7858-41fd-85dd-7f58747fd1cc.jpg"],"region":"PR-TF 43.4 Altos de Garachico","permit":"","notice":""},{"name":"PR TF 43.5 Recreational Area Arenas Negras Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-43-5-sendero-circular-arenas-negras-3","distance_km":null,"rating":3,"difficulty":"Low","description":"This branch of the PR TF 43 trail (Garachico - Chinyero - Garachico) takes you on an easy walk around the Arenas Negras Volcano. Also known as Volcán de Garachico, this volcano was formed by one of the most recent eruptions on the island in 1706. The volcano takes its other name from the town of Garachico, the trading capital of Tenerife at the time, which was destroyed by the eruption.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_43.5_Circular_Arenas_Negras/Arenas_Negras.jpg"],"region":"PR-TF 43.5 Altos de Garachico","permit":"","notice":""},{"name":"PR TF 43.6 Los Poleos Viewpoint – Chinyero","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-43-6-los-poleos-viewpoint-chinyero","distance_km":null,"rating":0,"difficulty":"Low","description":"This easy trail starts at the Los Poleos viewpoint and connects with the PR TF 43 Garachico – Chinyero trail at the track named Pista Montaña de la Cruz. The route starts at one of the most popular viewpoints on the island, but there are very few parking spaces. If you want to save yourself this inconvenience, we recommend hiring a taxi service or private transport to get to this point.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_43.6_Mirador_de_los_Poleos/lospoleos7.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.6_Mirador_de_los_Poleos/43.6_1.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.6_Mirador_de_los_Poleos/43.6_2.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.6_Mirador_de_los_Poleos/43.6_3.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.6_Mirador_de_los_Poleos/43.6_4.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_43.6_Mirador_de_los_Poleos/43.6_5.jpg"],"region":"PR TF 43.6 Altos de Garachico","permit":"","notice":""},{"name":"PR TF 51.1 Los Carrizales","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-51-1-los-carrizales","distance_km":2.08,"rating":3,"difficulty":"Medium","description":"Extension of the PR TF 51 trail from San José de los Llanos to Punta de Teno, which takes you to the hamlet of Los Carrizales, next to the ravine of the same name (Barranco del Carrizal).","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_51.1_Los_Carrizales/Nuevas_Los_Carrizales/IMG_5973.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_51.1_Los_Carrizales/Nuevas_Los_Carrizales/IMG_5974.JPG"],"region":"PR-TF 51.1 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 52.1 El Palmar - Monte del Agua. (via Las Huertas)","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-52-1-monte-del-agua-ramal-las-huertas","distance_km":2.94,"rating":3,"difficulty":"Medium","description":"Spur trail of the main PR TF 52 trail that branches off to the right in the area of La Mesita towards Camino de las Huertas. Take in the natural viewpoint of Lomo los Mulos and then begin a slightly steeper descent towards Fuente Bermeja along a track that winds through the laurel forest that characterises Monte del Agua.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_52.1_Monte_del_Agua_Ramal_Las_Huertas/opt-panorama_sin_ti%CC%81tulo26.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.1_Monte_del_Agua_Ramal_Las_Huertas/opt-04_prtf52.1panoramica.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.1_Monte_del_Agua_Ramal_Las_Huertas/opt-panorama_sin_ti%CC%81tulo29.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.1_Monte_del_Agua_Ramal_Las_Huertas/opt-panorama_sin_ti%CC%81tulo_1.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.1_Monte_del_Agua_Ramal_Las_Huertas/opt-_ndr6894.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.1_Monte_del_Agua_Ramal_Las_Huertas/opt-_ndr7020.jpg"],"region":"PR-TF 52.1 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 52.2 El Palmar - Monte del Agua (Via Las Lagunetas)","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-52-2-monte-del-agua-ramal-las-lagunetas","distance_km":2.49,"rating":2.5,"difficulty":"Low","description":"This is a branch of the PR TF 52 trail with the same destination as the PR TF 52.1 but runs through the western part of El Palmar instead of the eastern part. Shortly before reaching Las Portelas, take Camino Arrandianes on your right, which descends gently towards Camino El Ojito. Continue towards Las Cuevas to reach the end point of the route after walking along the El Palmar Valley and passing by the Teno Rural Park Visitor Centre, Los Pedregales.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_52.2_Montel_del_Agua_Ramal_Las_Lagunetas/opt-_ndr7271.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.2_Montel_del_Agua_Ramal_Las_Lagunetas/opt-panorama_sin_ti%CC%81tulo9.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.2_Montel_del_Agua_Ramal_Las_Lagunetas/opt-_ndr7215.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.2_Montel_del_Agua_Ramal_Las_Lagunetas/opt-_ndr7234.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_52.2_Montel_del_Agua_Ramal_Las_Lagunetas/opt-_ndr7246.jpg"],"region":"PR-TF 52.2 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 53 Los Silos - Erjos (por Cuevas Negras) Self-guided trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-53-cuevas-negras","distance_km":null,"rating":4,"difficulty":"Medium","description":"This trail starts at Erjos and heads into the dense and characteristic laurisilva forest of Monte del Agua. The path descends gently northwards along the course of the Barranco de Cuevas Negras ravine along an ancient camino real (“royal road” or main island route) that connected the villages of Los Silos and Santiago del Teide. If you pay close attention, you will still be able to see the cobblestones in some sections of the track.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_53_Cuevas_Negras/opt-_ndr2515.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53_Cuevas_Negras/opt-panorama_sin_ti%CC%81tulo2.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53_Cuevas_Negras/opt-panorama_sin_ti%CC%81tulo5.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53_Cuevas_Negras/opt-_ndr2342.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53_Cuevas_Negras/opt-_ndr2595.jpg"],"region":"PR-TF 53 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 53.1 Autoguiado Cuevas Negras - Tierra del Trigo autoguided trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-53-1-cuevas-negras-tierra-del-trigo-spur-trail","distance_km":2.26,"rating":3.5,"difficulty":"Medium","description":"Branch of the main PR TF 53 (Cuevas Negras) trail that starts right from the abandoned settlement in Barranco Cuevas Negras. From this point, where a huge Canary laurel tree grows, reputedly the largest in the world, you will gently ascend Lomo del Topo in a north-easterly direction. On the way you will be able to admire the wonderful panoramic views of the Isla Baja, with notable landmarks that include Montaña de Taco and the Buenavista lighthouse.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_53.1_Cuevas_Negras_desvi%CC%81o_Tierra_del_Trigo/opt-pr-tf-53-1-cuevas-negras-tierra-del-trigo-gal05.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53.1_Cuevas_Negras_desvi%CC%81o_Tierra_del_Trigo/opt-pr-tf-53-1-cuevas-negras-tierra-del-trigo-gal01.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53.1_Cuevas_Negras_desvi%CC%81o_Tierra_del_Trigo/opt-pr-tf-53-1-cuevas-negras-tierra-del-trigo-gal02.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53.1_Cuevas_Negras_desvi%CC%81o_Tierra_del_Trigo/opt-pr-tf-53-1-cuevas-negras-tierra-del-trigo-gal03.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_53.1_Cuevas_Negras_desvi%CC%81o_Tierra_del_Trigo/opt-pr-tf-53-1-cuevas-negras-tierra-del-trigo-gal04.jpg"],"region":"PR-TF 53.1 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 55 El Palmar - Los Silos (Por Talavera)","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-55-talavera","distance_km":null,"rating":3,"difficulty":"Medium","description":"This trail links the area of La Pina with El Palmar, passing through the abandoned settlement of Talavera and its beautiful views over the valley. It starts in La Pina and climbs up the cobbled path that is still intact today and which formed part of the old footpath that linked Talavera with Los Silos. The slope becomes steeper at Lomo de Los Cardones, where you will begin to enjoy magnificent panoramic views of Isla Baja.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/opt-_ndr4727.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/opt-04_prtf55panoramica.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/opt-panorama_sin_ti%CC%81tulo.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/opt-_igp3104.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/opt-_ndr4645.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_55_Talavera/opt-_ndr4741.jpg"],"region":"PR-TF 55 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 56 El Palmar - Casas de La Cumbre","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-56-el-palmar-casas-de-la-cumbre","distance_km":null,"rating":0,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_56_El_Palmar_Casas_de_la_Cumbre/opt-_ndr1879.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_56_El_Palmar_Casas_de_la_Cumbre/opt-_ndr1842.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_56_El_Palmar_Casas_de_la_Cumbre/opt-_ndr1721.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_56_El_Palmar_Casas_de_la_Cumbre/opt-panorama_elpalmar2.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_56_El_Palmar_Casas_de_la_Cumbre/opt-panorama_elpalmar.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_56_El_Palmar_Casas_de_la_Cumbre/opt-04_prtf56panoramica.jpg"],"region":"PR-TF 56 Macizo de Teno","permit":"","notice":"Access restricted due to damage caused by heavy rain."},{"name":"PR TF 57 El Palmar - Teno Alto. Callejón de Teno","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-57-callejon-de-teno","distance_km":3.87,"rating":2.5,"difficulty":"Medium","description":"The Callejón de Teno trail is an old camino real (“royal road” or main island route) that used to link El Palmar and Teno Alto. The route starts at the Los Pedregales Visitor Centre, from where it heads uphill along the cobbled path towards the Teno Massif to the west. From the Alto de la Cumbre viewpoint you will enjoy magnificent panoramic views of the El Palmar Valley, the Los Corchos ravine and, in general, the beautiful Teno Rural Park.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_57_Callejo%CC%81n_de_Teno/opt-_ndr6419.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_57_Callejo%CC%81n_de_Teno/opt-_ndr6411.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_57_Callejo%CC%81n_de_Teno/opt-_ndr6377.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_57_Callejo%CC%81n_de_Teno/opt-_ndr6334.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_57_Callejo%CC%81n_de_Teno/opt-panorama_sin_ti%CC%81tulo1.jpeg","https://www.tenerifeon.es/images/Senderos/PR_TF_57_Callejo%CC%81n_de_Teno/opt-04_prtf57panoramica.jpg"],"region":"PR-TF 57 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 58 Teno Alto - Buenavista del Norte. Camino del Risco","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-58-camino-del-risco","distance_km":3.73,"rating":3,"difficulty":"Medium","description":"Camino del Risco is the old trail that linked Teno Alto and Buenavista del Norte, also known as Camino de los Muertos. It received this name because it was the route taken by the locals to bring coffins down from Los Bailaderos to the town centre for burial. The route starts in Plaza de los Bailaderos, next to the Teno Church, and descends northwards along Camino de La Torre.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_58_Camino_del_Risco/opt-_ndr4278.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_58_Camino_del_Risco/opt-_ndr4245.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_58_Camino_del_Risco/opt-_ndr4230.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_58_Camino_del_Risco/opt-_ndr4100.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_58_Camino_del_Risco/opt-panorama_sin_ti%CC%81tulo1.jpg"],"region":"PR-TF 58 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 59 Las Portelas - Masca","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-59-las-portelas-masca","distance_km":3.65,"rating":3.5,"difficulty":"Low","description":"This pleasant trail between Las Portelas and Masca offers magnificent views of the Teno Massif and the Masca ravine. The route starts in La Portela Baja and heads south-west along Calle de Fuera, turning off to the right to join the footpath. You will arrive at Barranco de Las Lubes and, after crossing it, begin the ascent of the first section that will take you up the slopes of Martín Bay after crossing Pista El Mazapé.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_59_Las_Portelas_Masca/IMG_5971.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_59_Las_Portelas_Masca/IMG_5972.JPG"],"region":"PR-TF 59 Macizo de Teno","permit":"","notice":""},{"name":"PR TF 65 Santiago del Teide - Puerto Santiago","url":"https://www.tenerifeon.es/en/routes/hiking/santiago-del-teide-puerto-santiago-2","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"This trail follows the old Camino Real (“royal road” or main island route) that connected Santiago del Teide with Puerto Santiago, on the west coast of the island. The route starts in the square of Santiago del Teide and takes you to the centre of El Molledo. Once in this village, you will find a slightly descending path on the right, flanked by abandoned farmland. Follow the path to the next fork and continue along the path that descends to the left until you reach Tamaimo.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_65_Santiago_del_Teide_Puerto_Santiago/_NDR3227.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_65_Santiago_del_Teide_Puerto_Santiago/Panorama_1_mod.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_65_Santiago_del_Teide_Puerto_Santiago/Panorama_2_mod.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_65_Santiago_del_Teide_Puerto_Santiago/Panorama_3_mod.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_65_Santiago_del_Teide_Puerto_Santiago/_NDR3293.JPG"],"region":"PR-TF 65 Santiago del Teide","permit":"","notice":""},{"name":"PR TF 70.1 Boca Tauce - El Jaral","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-70-1-boca-tauce-el-jaral","distance_km":null,"rating":0,"difficulty":"Medium","description":"Branch of the PR-TF 70 trail (Guía - Tágara - Boca Tauce) that begins at the Juan Évora Ethnographic Museum in Boca Tauce. You’ll begin the descent through pine forest until you reach the Tágara Forest House, where you can see the remains of a heavily deteriorated old tar oven and, on the side of the track, the famous \"Pino de la Virgen\" (Virgin’s Pine), which was knocked down by a storm.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_71.1_Boca_Tauce_El_Jaral/IMG_20200714_085003_1.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_71.1_Boca_Tauce_El_Jaral/IMG_20200714_085820.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_71.1_Boca_Tauce_El_Jaral/DSC_0078.jpg"],"region":"PR-TF 70.1 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 70.2 Boca Tauce - Las Fuentes","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-70-2-boca-tauce-las-fuentes","distance_km":null,"rating":4,"difficulty":"High","description":"This branch of the PR TF 70 trail (Guía - Tágara - Boca Tauce) starts in an area known as Llano del Negro or Tumba del Negro. You will notice that there is a track close to your left, but the footpath cuts straight across it at several points. At several points along the way, you will be rewarded with stunning panoramic views of the mountains of Isora, and even as far as the islands of La Gomera, La Palma and El Hierro.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_70.2_Boca_Tauce_Las_Fuentes/Fuentes.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_70.2_Boca_Tauce_Las_Fuentes/Las_Fuentes.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_70.2_Boca_Tauce_Las_Fuentes/Las_Fuentes_2.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_70.2_Boca_Tauce_Las_Fuentes/Las_Fuentes_3.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_70.2_Boca_Tauce_Las_Fuentes/Las_Fuentes_4.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_70.2_Boca_Tauce_Las_Fuentes/Las_Fuentes_5.jpg"],"region":"PR-TF 70.2 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 70.3 Boca Tauce - Chasogo refuge","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-70-3-chavao","distance_km":null,"rating":2.5,"difficulty":"Medium","description":"This branch of the PR TF 70 (Guía - Tágara - Boca Tauce) connects with the Chasogo mountain shelter and the first section runs along the PNT 18 (Chavao) trail of the Teide National Park. You can start the route either from the car park of the Juan Evora Ethnographic Museum, in Boca Tauce, or from the Narices del Teide viewpoint. The route heads through lava fields at the beginning, with interesting volcanic landforms.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_70.3_Chasogo/SDC10420.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_70.3_Chasogo/SDC10421.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_70.3_Chasogo/DSCN0321.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_70.3_Chasogo/DSCN3539.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_70.3_Chasogo/DSCN3791.JPG","https://www.tenerifeon.es/images/Senderos/PR_TF_70.3_Chasogo/DSCN3794.JPG"],"region":"PR-TF 70.3 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 70.5. PR TF 70 - PR TF 70.3 Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-70-5-link-between-pr-tf-70-and-pr-tf-70-3","distance_km":3.5,"rating":4.5,"difficulty":"Medium","description":"This section of just over 3.5 kilometres connects PR TF 70 (Guía – Tágara – Boca Tauce) with PR TF 70.3 (Boca Tauce – Refugio de Chasogo). The trail features some steep climbs and enables you to extend and link up with other trails in the area around Guía de Isora.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_70_Gui%CC%81a_Ta%CC%81gara_Boca_Tauce/opt-panora%CC%81mica_pr-_70_gui%CC%81a_de_isora_-_boca_tauce.jpg"],"region":"PR-TF 70.5 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 70.6. PR TF 70.1 - PR TF 70.2 Spur trail","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-70-6-link-between-pr-tf-70-1-con-pr-tf-70-2","distance_km":null,"rating":5,"difficulty":"Low","description":"A short and easy walk of less than one kilometre that connects the PR TF 70.1 Boca Tauce – El Jaral and PR TF 70.2 Boca Tauce – Las Fuentes trails, passing through a typical pine forest in the south of Tenerife. This section is ideal for linking up routes in the network of trails in the area.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_70.2_Boca_Tauce_Las_Fuentes/Las_Fuentes_2.jpg"],"region":"PR-TF 70.6 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 71.1 Boca del Paso – La Quinta","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-71-1-boca-del-paso-la-quinta","distance_km":null,"rating":0,"difficulty":"Medium","description":"This short trail heads northwest from Boca del Paso, through a landscape marked by centuries of traditional agriculture, until it reaches the historic centre of La Quinta, which dates back to the 16th century. Along the route you will see many ethnographic features that bear witness to its agricultural past: threshing floors, farming terraces, irrigation channels built with stone and wood, cisterns and the remains of rural dwellings.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_71.1_Boca_del_Paso_La_Quinta/Boca_del_Paso_La_Quinta.jpg"],"region":"PR-TF 71.1 Adeje","permit":"","notice":""},{"name":"PR TF 71.2 Ifonche – La Quinta (Camino de Ifonche)","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-71-2-ifonche-la-quinta-camino-de-ifonche","distance_km":null,"rating":0,"difficulty":"High","description":"This trail links the hamlet of Ifonche with the historic centre of La Quinta, one of the oldest settlements in the area. It runs along part of the old Camino Real that connected the upper reaches of Guía de Isora, Adeje, Arona and Vilaflor. It also crosses three Protected Natural Areas, which adds to its cultural, scenic and environmental value.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_71.2_Ifonche/CaminoIfonche.jpg"],"region":"PR-TF 71.2 Adeje","permit":"","notice":""},{"name":"PR TF 83 Altos de Granadilla","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-83-altos-de-granadilla","distance_km":null,"rating":0,"difficulty":"Medium","description":"This route connects Granadilla de Abona with the enchanting Lunar Landscape in Los Escurriales. Starting from the hamlet of Cruz de Tea, in the municipality of Granadilla de Abona, the trail ascends through the streets until it connects with a branch of the old Camino Real de Chasna that will take you to La Casa de Los Malejos. Continue ascending until you reach Las Crucitas.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_83_Altos_de_Granadilla/opt-pr_-_tf_83_cruz_de_tea_-_los_escurriales_005.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83_Altos_de_Granadilla/opt-pr_-_tf_83_cruz_de_tea_-_los_escurriales_006.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83_Altos_de_Granadilla/opt-pr_-_tf_83_cruz_de_tea_-_los_escurriales_004.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83_Altos_de_Granadilla/opt-pr_-_tf_83_cruz_de_tea_-_los_escurriales_003.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83_Altos_de_Granadilla/opt-pr_-_tf_83_cruz_de_tea_-_los_escurriales_002.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83_Altos_de_Granadilla/opt-pr_-_tf_83_cruz_de_tea_-_los_escurriales_001.jpg"],"region":"PR-TF 83 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 83.1 Las Vegas - Los Escurriales","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-83-1-las-vegas-los-escurriales","distance_km":null,"rating":5,"difficulty":"High","description":"This trail sets off from Las Vegas, the first place to be settled by the Spanish in the municipality of Granadilla de Abona. It was founded at the beginning of the 16th century around the church of Nuestra Señora de la Esperanza. From the church, head north-west along the Camino de Guajara, the first section of which is asphalted. Leave Camino del Bujero to the right and head up Cañada La Pasada on the left until you reach the imposing rock face of Risco El Muerto.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_83.1_Las_Vegas_Los_Escurriales/PR_-_TF_83.1_Las_Vegas_-_Los_Escurriales_002.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.1_Las_Vegas_Los_Escurriales/PR_-_TF_83.1_Las_Vegas_-_Los_Escurriales_003.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.1_Las_Vegas_Los_Escurriales/TWF_WED-4_31.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.1_Las_Vegas_Los_Escurriales/PR_-_TF_83.1_Las_Vegas_-_Los_Escurriales_001.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.1_Las_Vegas_Los_Escurriales/PR-TF83.1_ERA.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.1_Las_Vegas_Los_Escurriales/04_PRTF83.1Vistas.jpg"],"region":"PR-TF 83.1 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 83.2 Camino de La Corredera","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-83-2-camino-de-la-corredera","distance_km":null,"rating":3,"difficulty":"Low","description":"This short trail runs along the old Camino La Corredera to connect the villages of Las Vegas and Cruz de Tea. This is a variant of just 1.5 km that links the PR TF 83 along Camino Real Madre del Agua, with the PR TF 83.1 along Camino de Los Cardos, connecting both villages in the upper reaches of the municipality of Guía de Isora. This route expands the combinations and options for the trail network in this part of the island.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_83.2_Camino_Las_Correderas/_NDR5257.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.2_Camino_Las_Correderas/_NDR5203.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.2_Camino_Las_Correderas/_NDR1808.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.2_Camino_Las_Correderas/_NDR1600.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.2_Camino_Las_Correderas/Panorama_sin_ti%CC%81tulo37.jpg","https://www.tenerifeon.es/images/Senderos/PR_TF_83.2_Camino_Las_Correderas/Panorama_sin_ti%CC%81tulo36.jpg"],"region":"PR-TF 83.2 Comarca Chasna - Isora","permit":"","notice":""},{"name":"PR TF 86.1 Spur trail to Casa Forestal (Forest House)","url":"https://www.tenerifeon.es/en/routes/hiking/pr-tf-86-1-spur-trail-to-casa-forestal-forest-house","distance_km":null,"rating":3,"difficulty":"Low","description":"This short spur trail of about 500 metres connects the PR TF 86 El Contador – Parador trail with the building known as the “casa forestal” at El Contador. The ascent takes you through a pine forest typical of the south of the island. When you reach the end of the route, you can enjoy a spectacular view from the casa forestal, stretching from the southeastern valley of the island all the way to the sea.","photos":["https://www.tenerifeon.es/images/Senderos/PR_TF_86_Villa_de_Arico_Cumbre_de_Arico/Nuevas_F%C3%A1tima/20240530_145410.jpg"],"region":"PR-TF 86.1 Montes de Arico","permit":"","notice":""},{"name":"PR TF 86.2 Spur trail to Fuente del Llano Campsite for tents","url":"https://www.tenerifeon.es/en/routes/hiking/fuente-del-llano-2","distance_km":null,"rating":0,"difficulty":"Low","description":"This gentle walk branches off the main trail to offer you spectacular views of the Teide on clear days. Only 400 metres long, this spur trail takes you from the PR TF 86 El Contador – Parador trail to the Fuente del Llano campsite for tents, through a pine forest typical of the south of the island.","photos":["https://www.tenerifeon.es/images/Zonas_de_Acampada/ZA_01_Zona_de_Acampada_Fuente_del_Llano/Nueva/Fuente_del_Llano.jpg","https://www.tenerifeon.es/images/Espacios_Naturales/T-11_PN_CORONA_FORESTAL/op-CoronaCaraNorte.Tenerife.FOTO_JuanjoRamos.JPG"],"region":"PR-TF 86.2","permit":"","notice":""},{"name":"Rambla de Castro Trail","url":"https://www.tenerifeon.es/en/routes/hiking/rambla-de-castro-2","distance_km":4,"rating":3,"difficulty":"Low","description":"The Rambla de Castro Trail is a 4 km route that links the San Pedro and El Burgado viewpoints, on the north coast of Tenerife. It is a low-difficulty route, with no major elevation changes, and features a combination of cobbled sections, dirt tracks and traditional footpaths.","photos":["https://www.tenerifeon.es/images/Senderos/Rambla_de_Castro/rambla_de_castro-cab-D.jpg","https://www.tenerifeon.es/images/Senderos/Rambla_de_Castro/rambla_de_castro-tenerife_0.jpg"],"region":"Rambla de Castro","permit":"","notice":""},{"name":"Risco de Guaria climbing area","url":"https://www.tenerifeon.es/en/routes/climbing/risco-de-guaria-climbing-area","distance_km":3,"rating":0,"difficulty":"","description":"The Risco de Guaria climbing area is located in the municipality of Guía de Isora, specifically in the Montaña de Tejina Natural Monument, a volcanic dome that is home to natural habitats. As established in the Conservation Rules for this protected natural area, climbing is an activity subject to authorisation, whether carried out individually, promoted by a public or private entity, or by an individual acting for profit.","photos":["https://www.tenerifeon.es/images/Escalada/Guaria/Guaria_1.jpg","https://www.tenerifeon.es/images/Escalada/Guaria/Guaria_2.jpg","https://www.tenerifeon.es/images/Escalada/Guaria/Guaria.png"],"region":"Acojeja, Guía de Isora.","permit":"","notice":""},{"name":"Roques de García Accessible Trail","url":"https://www.tenerifeon.es/en/routes/hiking/sa-pnt-03-sendero-accesible-roques-de-garcia","distance_km":null,"rating":4,"difficulty":"Low","description":"This accessible trail starts at La Ruleta viewpoint and runs alongside the Roques de García. The path takes you more than 200 metres to a spot that affords views of the emblematic Roque Cinchado, the alignment of the Roques de García, Mount Teide and the rock face of the Las Cañadas cirque, where the most prominent peak is Guajara, just behind the Parador Nacional.","photos":["https://www.tenerifeon.es/images/Senderos/Sendero_Accesible_Roques_de_Garc%C3%ADa/IMG_4577.JPG","https://www.tenerifeon.es/images/Senderos/Sendero_Accesible_Roques_de_Garc%C3%ADa/IMG_4589.JPG","https://www.tenerifeon.es/images/Senderos/Sendero_Accesible_Roques_de_Garc%C3%ADa/IMG_4592.JPG","https://www.tenerifeon.es/images/Senderos/Sendero_Accesible_Roques_de_Garc%C3%ADa/IMG_4593.JPG","https://www.tenerifeon.es/images/Senderos/Sendero_Accesible_Roques_de_Garc%C3%ADa/IMG_4598.JPG"],"region":"Teide National Park","permit":"","notice":""},{"name":"SL TF 151 Erjos - Ruigómez - Erjos Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/ruigomez-erjos-2","distance_km":null,"rating":3,"difficulty":"Medium","description":"This circular route takes you on a journey through the history of Ruigómez and Erjos, villages. If you look closely as you walk, you will see various threshing floors concealed alongside the path, a testimony to the importance of cereal and agricultural activity for the economy of the El Tanque municipality. The path starts out from Erjos along Calle Don Antonio Dorta Curbelo and heads out of the village.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_151_Ruigomez_Erjos/Panorama_sin_t%C3%ADtulo2.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_151_Ruigomez_Erjos/Panorama_sin_t%C3%ADtulo4.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_151_Ruigomez_Erjos/_NDR7405.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_151_Ruigomez_Erjos/_NDR7473.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_151_Ruigomez_Erjos/_NDR7520.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_151_Ruigomez_Erjos/_NDR7529.JPG"],"region":"SL-TF 151 Parque Rural de Teno","permit":"","notice":""},{"name":"SL TF 151.1 Ruigómez - San José de Los Llanos Recreational Area","url":"https://www.tenerifeon.es/en/routes/hiking/ruigomez-san-jose-de-los-llanos-2","distance_km":null,"rating":0,"difficulty":"Low","description":"This trail runs through a monteverde forest in a perfect state of conservation as a result of the natural protection provided by the Barranco del Guirre ravine. The trail is popularly known as the “Ruta del Agua” (Water Route) due to the ancient galleries found along it. You will also be able to see small hollows that were dug to collect water along the path, as well as a spring that emerges between the basalt and the soil.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_151.1_Ruigomez_San_Jose_de_los_Llanos/Horizontal_cueva.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_151.1_Ruigomez_San_Jose_de_los_Llanos/Senda.jpg"],"region":"SL-TF 151.1 Chinyero","permit":"","notice":""},{"name":"SL TF 26 Los Nateros - La Vica Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/los-nateros-la-vica-2","distance_km":null,"rating":3,"difficulty":"","description":"","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_26_Nateros_Vica/Nuevas/Escaleras.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_27/Nuevas/Senal.jpg"],"region":"SL-TF 26 Los Nateros, La Matanza de Acentejo","permit":"","notice":"Risk of falling trees."},{"name":"SL TF 27 Los Nateros - Morra del Pino Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/los-nateros-morra-del-pino-2","distance_km":null,"rating":3,"difficulty":"High","description":"This challenging loop trail takes you through a changing landscape from the terraced fields of Los Nateros to the pine forest of Pico La Morra. Please bear in mind that the route has very steep sections. Check that you are in good enough physical condition before setting off on this route.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_26_Nateros_Vica/Nuevas/Troncos.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_26_Nateros_Vica/Nuevas/Escaleras.jpg"],"region":"SL-TF 27 Los Nateros, La Matanza de Acentejo","permit":"","notice":""},{"name":"SL TF 292 Samarines","url":"https://www.tenerifeon.es/en/routes/hiking/samarines-2","distance_km":2.19,"rating":0,"difficulty":"Low","description":"This trail leads from the Basilica of Candelaria to the Playa de la Viuda beach, in parallel to the cliff that runs along the coast. This coastal route links the seaside towns of Candelaria, Arafo and Güímar, and is part of the “Marian Triangle”, traditionally linked to apparitions and places of worship of Our Lady of Candelaria. It is therefore a route in use since prehistoric times.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_292_Samarines/_NDR0987.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_292_Samarines/_NDR0962.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_292_Samarines/_NDR1076.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_292_Samarines/_NDR1110.jpg"],"region":"SL-TF 292 Candelaria Coast","permit":"","notice":""},{"name":"SL TF 294 Los Brezos Loop Trail","url":"https://www.tenerifeon.es/en/routes/hiking/los-brezos-2","distance_km":null,"rating":3.5,"difficulty":"Medium","description":"The Los Brezos loop trail takes you along the traditional footpaths linking Igonce, Los Brezos, Piedras de Carcho, El Luchón and Barranco La Gotera. Most of the route runs through an area known for its agricultural activity in the upper reaches of the south-east of Tenerife. Some of the most representative heritage features you will see along the way are water channels, drinking troughs, water sources, reservoirs and stone ovens for drying fruit.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_294_Los_Brezos/_NDR2473.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_294_Los_Brezos/_NDR2564.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_294_Los_Brezos/_NDR2596.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_294_Los_Brezos/_NDR2651.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_294_Los_Brezos/_NDR2730.JPG"],"region":"SL-TF 294 Valle de Güímar","permit":"","notice":""},{"name":"SL TF 294.1 El Moralito","url":"https://www.tenerifeon.es/en/routes/hiking/el-moralito-2","distance_km":2.6,"rating":0,"difficulty":"Low","description":"This short, pleasant trail of just 2.6 km connects the centre of Malpaís with the other routes of the Local Trails Network of Candelaria. The path starts at Plaza de Malpaís and ends at Charca del Pino, taking in alternating stretches of tarmac and dirt tracks. Once at Charca del Pino you can see the remains of an old house next to a threshing floor and a stone oven.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_294.1_El_Moralito/_NDR8594.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_294.1_El_Moralito/_NDR8348.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_294.1_El_Moralito/_NDR8466_1.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_294.1_El_Moralito/_NDR8546.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_294.1_El_Moralito/_NDR8555.jpg","https://www.tenerifeon.es/images/Senderos/SL_TF_294.1_El_Moralito/_NDR8615.jpg"],"region":"SL-TF 294.1 Valle de Güímar","permit":"","notice":""},{"name":"SL TF 296 La Mesa","url":"https://www.tenerifeon.es/en/routes/hiking/la-mesa-2","distance_km":null,"rating":0,"difficulty":"Medium","description":"La Mesa offers magnificent panoramic views of the Güímar Valley and leads you deep into the Corona Forestal Natural Park. Along the route you will be able to spot some of the most representative species of native and endemic flora of our tabaibal-cardonal and pine forest ecosystems, along with traces of the agricultural and livestock farming practices that once flourished on these lands, characterised by cereal crops, fruit trees and vineyards.","photos":["https://www.tenerifeon.es/images/Senderos/SL_TF_296_La_Mesa/_NDR1923.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296_La_Mesa/_NDR1963.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296_La_Mesa/_NDR1971.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296_La_Mesa/_NDR2006.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296_La_Mesa/_NDR2079.JPG","https://www.tenerifeon.es/images/Senderos/SL_TF_296_La_Mesa/Panorama_sin_t%C3%ADtulo16.JPG"],"region":"SL-TF 296 Valle de Güímar","permit":"","notice":""},{"name":"SL TF 296.1 Barranco El Rincón","url":"https://www.tenerifeon.es/en/routes/hiking/barranco-el-rincon-2","distance_km":null,"rating":0,"difficulty":"Low","description":"Thi
